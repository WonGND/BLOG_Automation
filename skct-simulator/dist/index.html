      win.style.top = y + "px";
    });
    head.addEventListener("pointerup", function () { drag = null; });
    head.addEventListener("pointercancel", function () { drag = null; });
    win.addEventListener("pointerdown", function () { raise(win); });
    return win;
  }
  function raise(win) { z++; win.style.zIndex = String(z); }

  function toggle(key, on) {
    var win = wins[key];
    if (!win) return;
    var show = on === undefined ? win.hidden : on;
    /* 좁은 화면에서는 창이 화면을 다 덮으므로 한 번에 하나만 연다 */
    if (show && narrow()) Object.keys(wins).forEach(function (k) { if (k !== key) toggle(k, false); });
    win.hidden = !show;
    if (show) {
      raise(win);
      var inner = win.querySelector(".toolcalc, .toolnote") || win;
      inner.focus();
      if (key === "draw") fitCanvas();
    }
    dockBtns[key].classList.toggle("is-on", show);
    dockBtns[key].setAttribute("aria-pressed", String(show));
  }

  /* ---------------- 메모장 ---------------- */

  function buildNote() {
    var ta = el("textarea", {
      class: "toolnote", spellcheck: "false", "aria-label": "메모장",
      placeholder: "조건을 옮겨 적거나 계산 과정을 남겨 둔다. 이 브라우저에만 저장된다."
    });
    ta.value = store(K_NOTE) || "";
    var timer = null;
    ta.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () { store(K_NOTE, ta.value); }, 400);
    });
    return el("div", { class: "toolnote-wrap" }, [
      ta,
      el("div", { class: "toolbar-row" }, [
        el("button", { class: "toolbtn", type: "button", text: "전체 지우기",
          onclick: function () { ta.value = ""; store(K_NOTE, ""); ta.focus(); } })
      ])
    ]);
  }

  /* ---------------- 그림판 ---------------- */

  var canvas = null, ctx = null, sized = false, pen = { color: "#111111", size: 2, erase: false };

  /* 캔버스는 만들 때 크기를 주고, 준비는 한 번만 한다.
     canvas.width는 지정하지 않아도 300이라 그 값으로 '이미 준비됐는지'를 판단할 수 없다.
     또 width를 다시 대입하면 그려 둔 그림이 지워진다. */
  function fitCanvas() {
    if (!canvas || sized) return;
    sized = true;
    ctx = canvas.getContext("2d");
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    var saved = store(K_DRAW);
    if (saved) {
      var img = new Image();
      img.onload = function () { ctx.drawImage(img, 0, 0); };
      img.src = saved;
    }
  }
  function saveDraw() {
    try { store(K_DRAW, canvas.toDataURL("image/png")); } catch (e) { /* 저장 공간이 없으면 그냥 둔다 */ }
  }
  function buildDraw() {
    canvas = el("canvas", { class: "tooldraw", width: "560", height: "360", "aria-label": "그림판" });
    var drawing = false, last = null;
    function at(e) {
      var r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (canvas.width / r.width),
               y: (e.clientY - r.top) * (canvas.height / r.height) };
    }
    function stroke(p) {
      ctx.strokeStyle = pen.erase ? "#ffffff" : pen.color;
      ctx.lineWidth = pen.erase ? pen.size * 6 : pen.size;
      ctx.globalCompositeOperation = pen.erase ? "destination-out" : "source-over";
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
    }
    canvas.addEventListener("pointerdown", function (e) {
      fitCanvas();
      drawing = true; last = at(e);
      canvas.setPointerCapture(e.pointerId);
      stroke(at(e));
      e.preventDefault();
    });
    canvas.addEventListener("pointermove", function (e) { if (drawing) { stroke(at(e)); e.preventDefault(); } });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (t) {
      canvas.addEventListener(t, function () { if (drawing) { drawing = false; saveDraw(); } });
    });

    function swatch(color) {
      return el("button", {
        class: "toolsw" + (pen.color === color && !pen.erase ? " is-on" : ""),
        type: "button", "aria-label": "색 " + color, style: "background:" + color + ";",
        onclick: function (e) {
          pen.color = color; pen.erase = false;
          syncDrawBar(e.target.closest(".toolbar-row"));
        }
      });
    }
    function sizeBtn(n, label) {
      return el("button", { class: "toolbtn tool-size" + (pen.size === n ? " is-on" : ""), type: "button",
        "data-size": String(n), text: label,
        onclick: function (e) { pen.size = n; syncDrawBar(e.target.closest(".toolbar-row")); } });
    }
    var eraseBtn = el("button", { class: "toolbtn tool-erase", type: "button", text: "지우개",
      onclick: function (e) { pen.erase = !pen.erase; syncDrawBar(e.target.closest(".toolbar-row")); } });

    var bar = el("div", { class: "toolbar-row" }, [
      swatch("#111111"), swatch("#2a78d6"), swatch("#c9541f"),
      el("span", { class: "toolbar-sep" }),
      sizeBtn(2, "가늘게"), sizeBtn(4, "보통"), sizeBtn(8, "굵게"),
      el("span", { class: "toolbar-sep" }),
      eraseBtn,
      el("button", { class: "toolbtn", type: "button", text: "전체 지우기",
        onclick: function () {
          fitCanvas();
          ctx.globalCompositeOperation = "source-over";
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          saveDraw();
        } })
    ]);
    return el("div", { class: "tooldraw-wrap" }, [canvas, bar]);
  }
  function syncDrawBar(bar) {
    if (!bar) return;
    [].forEach.call(bar.querySelectorAll(".toolsw"), function (b) {
      b.classList.toggle("is-on", !pen.erase && b.style.background.indexOf(hexToRgb(pen.color)) >= 0);
    });
    [].forEach.call(bar.querySelectorAll(".tool-size"), function (b) {
      b.classList.toggle("is-on", Number(b.dataset.size) === pen.size);
    });

  }
  function hexToRgb(h) {
    var n = parseInt(h.slice(1), 16);

  }

  /* ---------------- 계산기 ---------------- */

  var calc = { cur: "0", acc: null, op: null, fresh: true }, calcOut = null;

  function calcShow() { if (calcOut) calcOut.textContent = calc.cur; }
  function calcDigit(d) {
    if (calc.fresh) { calc.cur = d === "." ? "0." : d; calc.fresh = false; }
    else if (d === "." ) { if (calc.cur.indexOf(".") < 0) calc.cur += "."; }
    else if (calc.cur === "0") calc.cur = d;
    else if (calc.cur.replace(/[^0-9]/g, "").length < 12) calc.cur += d;
    calcShow();
  }
  function apply(a, b, op) {
    if (op === "+") return a + b;
    if (op === "−") return a - b;
    if (op === "×") return a * b;
    if (op === "÷") return b === 0 ? NaN : a / b;
    return b;
  }
  function fmt(v) {
    if (!isFinite(v)) return "오류";
    var r = Math.round(v * 1e10) / 1e10;
    return String(r).length > 14 ? r.toPrecision(10).replace(/\.?0+e/, "e") : String(r);
  }
  function calcOp(op) {
    var v = parseFloat(calc.cur);
    if (calc.op !== null && !calc.fresh) { v = apply(calc.acc, v, calc.op); calc.cur = fmt(v); calcShow(); }
    calc.acc = isFinite(v) ? v : 0;
    calc.op = op; calc.fresh = true;
  }
  function calcEq() {
    if (calc.op === null) { calc.fresh = true; return; }
    var v = apply(calc.acc, parseFloat(calc.cur), calc.op);
    calc.cur = fmt(v); calc.acc = null; calc.op = null; calc.fresh = true;
    calcShow();
  }

  function calcBack() {

    var keys = [

      ["7", null], ["8", null], ["9", null], ["×", function () { calcOp("×"); }, "op"],
      ["4", null], ["5", null], ["6", null], ["−", function () { calcOp("−"); }, "op"],
      ["1", null], ["2", null], ["3", null], ["+", function () { calcOp("+"); }, "op"],

    /* 키보드로 두드리려면 포커스를 받을 수 있어야 한다. 창을 열 때 여기로 포커스를 준다. */

  var dockBtns = {};
  var DEFS = [
    { key: "note", title: "메모장", icon: "✎", build: buildNote, pos: [null, 90] },

    { key: "calc", title: "계산기", icon: "＋", build: buildCalc, pos: [null, 210] }
  ];

  function build() {
    if (built) return;
    built = true;
    var right = 24;
    DEFS.forEach(function (d, i) {
      var x = Math.max(16, window.innerWidth - 360 - right - i * 28);

          el("span", { class: "tooldock-t", text: d.title })
        ]);
        dockBtns[d.key] = b;
        return b;
      }));
    dock.hidden = true;
    document.body.appendChild(dock);
  }

  /* 응시 화면에서만, 그리고 시간이 흐르는 동안에만 쓸 수 있다.
     멈춰 놓고 계산기를 두드릴 수 있으면 일시정지가 공짜 시간이 된다. */
  function setActive(on) {
    build();
    if (dock.hidden === !on) return;
    dock.hidden = !on;
    if (!on) Object.keys(wins).forEach(function (k) { toggle(k, false); });
  }

  window.SKCT_TOOLS = { setActive: setActive };
})();

  "E1-V-01": {
    kind: "passage",
    label: "[1] 다음 글을 읽고 물음에 답하시오.",
    text: "기술 표준을 정하는 자리에서 가장 자주 부딪히는 것은 기술의 우열이 아니라 시점이다. 표준을 이르게 확정하면 아직 검증되지 않은 방식이 굳어져 더 나은 대안이 뒤늦게 등장해도 갈아탈 수 없게 된다. 반대로 늦추면 업계가 제각기 다른 규격에 이미 투자를 마쳐 어느 쪽으로도 정리되지 않는다. 표준화 기구가 실제로 수행하는 일은 이 두 위험 사이에서 시점을 고르는 것이며, 그 판단의 근거는 기술의 성능보다 시장의 잠금 상태다. 기술적으로 열등한 방식이 표준이 된 사례가 반복되는 것도 이 때문이다. 그런 결정을 두고 흔히 정치적 타협이라 부르지만, 정확히 말하면 성능을 최적화하는 대신 전환 비용을 최소화하는 선택이다. 표준의 성패를 기술의 우열로만 평가하면 이 층위가 통째로 보이지 않는다."
  },
  "E1-V-02": {
    kind: "passage",
    label: "[2] 다음 글을 읽고 물음에 답하시오.",
    text: "도시의 대기 측정망은 오랫동안 '대표성 있는 지점'을 고르는 문제로 다뤄졌다. 몇 곳에 정밀 측정기를 두고 그 값을 도시 전체의 평균으로 삼는 방식이다. 그러나 같은 구역 안에서도 도로에서 몇십 미터만 떨어지면 농도가 절반으로 떨어진다는 사실이 확인되면서 이 전제는 흔들렸다. 대표 지점의 값은 도시의 평균일 수는 있어도 시민이 실제로 들이마시는 공기와는 다르다. (        ) 그래서 최근의 설계는 정밀도가 떨어지더라도 값싼 측정기를 촘촘히 깔고, 몇 대의 정밀 측정기로 그 값을 보정하는 쪽으로 옮겨 갔다. 측정의 목표가 도시를 대표하는 하나의 숫자에서 사람이 머무는 자리의 분포로 바뀐 것이다."
  },
  "E1-V-03": {
    kind: "passage",
    label: "[3] 다음 글을 읽고 물음에 답하시오.",
    text: "어떤 정책이 효과가 있었는지 보려면 시행한 집단과 시행하지 않은 집단을 견주면 된다. 문제는 정책이 필요한 곳에 우선 시행된다는 점이다. 사고가 잦은 구간에 신호 체계를 먼저 손보고, 성적이 낮은 학교에 지원을 먼저 넣는다. 이렇게 되면 시행 집단은 애초에 나쁜 상태였으므로, 시행 후에도 비시행 집단보다 성적이 낮게 나오기 쉽다. 정책이 효과가 있었더라도 단순 비교로는 효과가 없거나 오히려 해로운 것처럼 보인다. 이 왜곡을 줄이려고 연구자들은 시행 직전 시점의 상태가 비슷한 짝을 찾아 맞붙이거나, 시행 전후의 변화폭끼리 비교한다. 어느 쪽이든 비교의 단위를 '수준'에서 '변화'로 옮기는 조정이다."
  },
  "E1-V-04": {
    kind: "passage",
    label: "[4] 다음 글을 읽고 물음에 답하시오.",
    text: "제조업의 자동화를 논할 때 흔히 '사람이 하던 일을 기계가 대신한다'는 그림을 떠올린다. 현장의 기록은 다른 이야기를 한다. 자동화가 가장 빠르게 진행된 공정에서도 인원은 크게 줄지 않았고, 대신 하는 일의 목록이 바뀌었다. 부품을 옮기고 끼우던 작업은 사라졌지만 설비가 멈춘 이유를 찾아내고 되살리는 일, 품질 편차의 원인을 공정 데이터에서 짚어 내는 일이 새로 생겼다. 새로 생긴 일은 설비와 제품과 공정을 한꺼번에 알아야 해서, 들어온 지 얼마 안 된 사람이 바로 맡기 어렵다. 그래서 자동화가 깊이 들어간 공장일수록 오래 일한 사람의 값이 오히려 올라간다. 문제는 그 숙련이 자라던 통로가 함께 사라졌다는 데 있다. 예전에는 단순 작업을 몇 해 반복하며 설비를 몸으로 익혔지만, 그 단계가 없어진 지금은 숙련에 이르는 길 자체를 새로 설계해야 한다."
  },
  "E1-V-05": {
    kind: "passage",
    label: "[5] 다음 글을 읽고 물음에 답하시오.",
    text: "해양 플라스틱의 출처를 따지면 어업 장비가 큰 몫을 차지한다. 버려진 그물과 통발은 가라앉지 않고 오래 떠다니면서 물고기를 계속 가둔다. 이 '유령어업'의 피해는 조업량 통계에 잡히지 않는데, 잡힌 물고기가 시장에 나오지 않기 때문이다. 장비에 식별 표지를 붙여 소유자를 추적하자는 제안이 오래전부터 있었지만 진전은 더뎠다. 표지를 붙이면 분실한 사람이 비용을 물게 되므로, 분실 자체를 신고하지 않을 유인이 생긴다는 반론 때문이다. 최근에는 방향을 바꿔, 장비를 반납하면 보증금을 돌려주는 방식이 시도된다. 처벌을 붙이는 대신 돌려받을 것을 만들어 두면 신고를 숨길 이유가 없어진다는 계산이다. 다만 보증금 수준이 장비 값에 비해 낮으면 그냥 버리는 편이 싸므로, 금액 설계가 제도의 성패를 가른다."
  },
  "E1-V-06": {
    kind: "passage",
    label: "[6] 다음 글을 읽고 물음에 답하시오.",
    text: "임상시험에서 위약을 받은 집단의 증상이 나아지는 현상은 널리 알려져 있다. 흔히 이를 '믿음이 몸을 바꾼다'는 이야기로 풀지만, 통계적으로 보면 다른 요인이 더 크다. 사람들은 증상이 가장 심할 때 병원을 찾는다. 그 시점은 정의상 평소보다 나쁜 상태이므로, 아무 처치를 하지 않아도 시간이 지나면 평소 수준으로 돌아온다. 위약 집단의 호전에는 이 되돌아옴이 섞여 있다. (        ) 그래서 위약 효과의 크기를 제대로 재려면 위약 집단과 무처치 집단을 함께 두고 비교해야 한다. 위약과 무처치를 나란히 놓은 연구들에서 위약 고유의 효과는 통증처럼 주관적으로 보고되는 항목에서만 뚜렷했고, 혈압이나 종양 크기 같은 객관적 지표에서는 거의 나타나지 않았다."
  },
  "E1-V-07": {
    kind: "passage",
    label: "[7] 다음 문단을 읽고 물음에 답하시오.",
    text: "(가) 그러나 이 방식은 예측이 빗나갔을 때 책임 소재를 흐린다는 비판을 받았다. 여러 모형의 평균값에는 어느 모형의 어떤 가정이 얼마나 반영됐는지가 드러나지 않기 때문이다.\n(나) 기상 예측은 오랫동안 하나의 모형을 정교하게 다듬는 방향으로 발전해 왔다. 관측을 늘리고 계산 격자를 촘촘히 하면 예보가 나아진다는 전제였다.\n(다) 지금의 예보는 여러 모형을 동시에 돌린 뒤 결과의 분포를 함께 제시한다. 하나의 값 대신 범위를, 확신 대신 확률을 내놓는 방식이다.\n(라) 전환점은 초기 조건의 미세한 차이가 시간이 지날수록 걷잡을 수 없이 벌어진다는 사실이 확인되면서 찾아왔다. 모형 하나를 아무리 다듬어도 그 한계는 남았다."
  },
  "E1-V-08": {
    kind: "passage",
    label: "[8] 다음 글을 읽고 물음에 답하시오.",
    text: "공공 자료를 개방하면 민간이 새로운 서비스를 만들 것이라는 기대가 있었다. 실제로 개방된 자료의 수는 빠르게 늘었지만, 그 자료를 쓴 서비스는 기대만큼 나오지 않았다. 이유를 조사해 보니 자료가 없어서가 아니라 자료의 모양이 제각각이어서였다. 같은 항목을 기관마다 다른 이름으로 적고, 갱신 주기도 다르며, 과거 자료를 덮어써 시계열이 남지 않는 경우도 많았다. 개발자는 자료를 쓰기 전에 자료를 정리하는 데 대부분의 시간을 썼다. 개방의 성과를 공개 건수로 재는 동안 정작 필요한 것은 건수가 아니라 형식의 합의였던 셈이다. 최근 일부 기관이 항목 이름과 갱신 주기를 맞추기 시작하면서 같은 자료로도 활용 사례가 늘고 있다."
  },
  "E1-V-09": {
    kind: "passage",
    label: "[9] 다음 글을 읽고 물음에 답하시오.",
    text: "신용평가 모형이 특정 지역 거주자에게 불리하게 작동한다는 지적이 나오자, 개발사는 모형에서 주소 항목을 제거했다. 그러나 결과는 거의 달라지지 않았다. 주소를 지워도 통신사 요금제, 주로 이용하는 상점, 출퇴근 시간대처럼 주소와 강하게 얽힌 변수들이 남아 있었기 때문이다. 모형은 지워진 항목을 남은 항목들로 되살려 냈다. 이 현상은 차별을 없애려면 해당 항목을 빼면 된다는 직관이 왜 잘 통하지 않는지를 보여 준다. 최근의 접근은 항목을 지우는 대신, 결과가 집단 간에 어떻게 갈리는지를 직접 재고 그 격차를 줄이도록 모형을 제약하는 쪽이다. 무엇을 입력하지 않을 것인가에서 무엇을 출력하지 않을 것인가로 질문이 옮겨 간 셈이다."
  },
  "E1-V-10": {
    kind: "passage",
    label: "[10] 다음 글을 읽고 물음에 답하시오.",
    text: "건물의 에너지 효율을 높이는 방법으로 단열재를 두껍게 하는 안과 창호를 바꾸는 안이 흔히 맞세워진다. 단열재는 벽 전체 면적에 작용하므로 열손실 총량을 크게 줄이지만 시공 중 거주가 어렵고 공사 기간이 길다. 창호 교체는 단위 면적당 손실이 가장 큰 부위를 먼저 손보는 방식이라 투입 대비 효과가 빠르게 나타나지만, 벽체의 손실은 그대로 남는다. 두 안은 목표가 같을 뿐 작동하는 층위가 다르다. 실제 사업에서는 예산과 입주 일정이라는 제약이 어느 쪽을 먼저 할지를 결정하며, 기술적 우열이 선택을 정하는 경우는 드물다. 효율 개선을 공학의 문제로만 놓고 보면 늘 단열재가 이기지만, 현장의 결정은 그 계산 밖에서 이루어진다."
  },
  "E1-V-11": {
    kind: "passage",
    label: "[11] 다음 글을 읽고 물음에 답하시오.",
    text: "의학 교과서는 오랫동안 통증을 손상의 신호로 설명해 왔다. 조직이 상하면 신경이 이를 전달하고 뇌가 통증으로 인식한다는 그림이다. 그런데 손상 정도와 통증의 크기가 일치하지 않는 사례가 너무 많았다. 큰 상처를 입고도 통증을 못 느끼는 경우가 있고, 영상 검사에서 아무 이상이 없는데도 심한 통증을 겪는 경우가 있다. 현재의 설명은 통증을 신호의 전달이 아니라 뇌가 내리는 판단으로 본다. 뇌는 신경에서 올라온 정보에 과거의 경험, 현재의 맥락, 앞으로의 위험 예측을 함께 넣어 지금 몸을 보호해야 하는지를 결정하고, 그 결정의 출력이 통증이라는 것이다. 이 관점에서 통증은 손상의 측정값이 아니라 보호가 필요하다는 판정이며, 손상이 없어도 판정은 내려질 수 있다."
  },
  "E1-V-12": {
    kind: "passage",
    label: "[12] 다음 글을 읽고 물음에 답하시오.",
    text: "국제 항공 운임에는 좌석 하나의 원가를 계산하기 어렵게 만드는 구조가 있다. 같은 비행기의 같은 구간이라도 승객이 낸 값은 크게 다르고, 화물칸에 실린 짐의 운임도 같은 연료와 같은 승무원을 나눠 쓴다. 항공사는 이 때문에 좌석 단위 원가 대신 좌석킬로미터당 비용이라는 지표를 쓴다. 좌석 수에 운항 거리를 곱한 값으로 총비용을 나눈 것이다. 이 지표는 노선 간 비교에는 쓸모가 있지만 특정 좌석의 손익을 말해 주지는 않는다. 마지막 한 좌석을 더 파는 데 드는 추가 비용은 거의 없으므로, 출발 직전의 빈 좌석은 아무리 싸게 팔아도 팔지 않는 것보다 낫다. 항공 운임이 출발일이 가까워질수록 오르다가 갑자기 떨어지는 구간이 생기는 이유가 여기에 있다."
  },
  "E1-V-13": {
    kind: "passage",
    label: "[13] 다음 글을 읽고 물음에 답하시오.",
    text: "기업이 고객 이탈을 막으려고 예측 모형을 돌려 이탈 위험이 높은 고객에게 할인 쿠폰을 보내는 일이 흔하다. 그런데 이 방식으로 이탈률이 떨어졌다는 보고가 나와도, 그것이 쿠폰 덕분인지는 분명하지 않다. 모형이 고른 고객은 이탈 위험이 높다고 판정된 사람들인데, 그중 상당수는 쿠폰이 없어도 남았을 사람이다. 반대로 정말 떠날 사람은 쿠폰 한 장으로 마음을 바꾸지 않는다. 쿠폰이 실제로 효과를 내는 대상은 '쿠폰이 있으면 남고 없으면 떠나는' 좁은 층뿐이다. 최근에는 이탈 위험 자체가 아니라 쿠폰을 받았을 때와 받지 않았을 때의 차이를 예측하는 모형을 쓴다. 예측의 대상이 상태에서 개입의 효과로 옮겨 간 것이다."
  },
  "E1-V-14": {
    kind: "passage",
    label: "[14] 다음 글을 읽고 물음에 답하시오.",
    text: "도시가 커질수록 1인당 도로 면적은 줄어드는데도 이동 시간은 크게 늘지 않는다. 언뜻 모순으로 보이지만 통계를 뜯어보면 설명이 된다. 큰 도시일수록 목적지가 가까워지기 때문이다. 직장과 상점과 병원이 조밀하게 들어차면 같은 일을 보러 가는 거리 자체가 짧아진다. (        ) 그래서 교통 정책의 목표를 '더 빨리 움직이게 하는 것'으로 잡으면 도로를 넓히는 쪽으로 기울고, '덜 움직여도 되게 하는 것'으로 잡으면 용도를 섞어 배치하는 쪽으로 기운다. 같은 혼잡을 놓고도 전혀 다른 처방이 나오는 것은 문제를 속도로 보느냐 거리로 보느냐의 차이에서 비롯된다."
  },
  "E1-V-15": {
    kind: "passage",
    label: "[15] 다음 글을 읽고 물음에 답하시오.",
    text: "백신의 효과를 말할 때 흔히 쓰는 '95%'라는 숫자는 접종자 백 명 중 아흔다섯 명이 보호된다는 뜻이 아니다. 이 값은 접종군과 비접종군의 발병률을 견준 상대적 감소분이다. 비접종군에서 천 명당 스무 명이 걸리고 접종군에서 한 명이 걸렸다면 감소분은 95%지만, 접종으로 실제로 막아진 사람은 천 명당 열아홉 명이다. 유행이 잠잠한 시기에는 같은 백신의 같은 효능에도 막아지는 절대 수가 훨씬 작아진다. 두 숫자는 서로 다른 질문에 답한다. 상대적 감소분은 백신이 얼마나 잘 듣는가를, 절대 감소분은 지금 이 상황에서 접종이 얼마나 도움이 되는가를 말한다. 어느 쪽도 틀리지 않지만, 한쪽만 제시하면 판단의 근거가 절반만 남는다."
  },
  "E1-V-16": {
    kind: "passage",
    label: "[16] 다음 글을 읽고 물음에 답하시오.",
    text: "어떤 자원을 여럿이 나눠 쓸 때, 각자가 조금씩 더 쓰는 선택이 합쳐지면 전체가 망가지는 상황이 있다. 한 사람이 더 쓰는 데서 오는 이득은 그 사람에게 온전히 돌아가지만, 그로 인한 손실은 모두가 나눠 지기 때문이다. 이 구조에서는 각자가 합리적으로 판단할수록 결과가 나빠진다. 해법은 크게 두 갈래다. 하나는 쓰는 양에 값을 매겨 손실을 쓰는 사람에게 되돌리는 것이고, 다른 하나는 쓸 수 있는 총량을 정해 놓고 그 안에서 나누는 것이다. 값을 매기는 쪽은 총량을 보장하지 못하고, 총량을 정하는 쪽은 누구에게 얼마를 줄지 정하는 과정에서 다툼이 생긴다."
  },
  "E1-V-17": {
    kind: "passage",
    label: "[17] 다음 글을 읽고 물음에 답하시오.",
    text: "건축에서 내진 설계는 흔들림을 견디는 문제로 이해되지만, 실제 설계는 견디는 쪽보다 흩뜨리는 쪽에 가깝다. 지진파는 특정 주기를 중심으로 에너지가 몰려 있고, 건물도 고유한 흔들림 주기를 가진다. 둘이 가까우면 작은 흔들림도 크게 증폭된다. 그래서 설계자는 구조물의 강성을 높이기만 하는 대신, 건물의 고유 주기를 지진파의 주기에서 떼어 놓는 방향을 함께 쓴다. 바닥에 유연한 받침을 넣어 주기를 늘리는 방식이 대표적이다. 강성을 높이면 주기는 짧아지므로, 지반의 특성에 따라서는 튼튼하게 만드는 선택이 오히려 증폭을 키울 수 있다. 무엇을 보강할지는 건물만 보고 정할 수 없고 지반의 성질과 함께 정해진다."
  },
  "E1-V-18": {
    kind: "passage",
    label: "[18] 다음 글을 읽고 물음에 답하시오.",
    text: "저작권 보호 기간을 늘리면 창작이 늘어난다는 주장은 직관적으로 그럴듯하다. 보상이 길어지면 만들 유인이 커진다는 논리다. 그러나 실제 자료는 이 연결을 잘 지지하지 않는다. 보호 기간 연장은 이미 만들어진 작품의 권리를 늘리는 것이므로, 앞으로 만들 사람의 계산에는 거의 영향을 주지 않는다. 지금 창작을 시작하는 사람에게 사후 오십 년과 칠십 년의 차이는 현재 가치로 환산하면 미미하다. 반면 연장의 비용은 곧바로 나타난다. 옛 작품을 쓰려면 권리자를 찾아야 하는데, 오래된 작품일수록 권리자 추적이 어려워 아예 쓰이지 못하고 묻히는 경우가 많다. 연장이 만드는 것은 새 창작이 아니라 이런 사장된 작품 더미일 수 있다."
  },
  "E1-V-19": {
    kind: "passage",
    label: "[19] 다음 글을 읽고 물음에 답하시오.",
    text: "토양의 탄소 저장 능력이 기후 대책으로 주목받고 있다. 경작 방식을 바꿔 땅을 덜 갈고 피복 작물을 심으면 토양에 탄소가 쌓인다는 연구가 이어졌다. 다만 이 저장은 영구적이지 않다. 다시 갈아엎으면 쌓인 탄소는 몇 해 만에 대기로 돌아간다. 또 저장 속도는 시간이 갈수록 느려져, 대개 수십 년이 지나면 토양이 포화에 가까워지고 추가 저장은 거의 멈춘다. 그래서 토양 탄소는 배출을 상쇄하는 수단이라기보다 감축 시간을 벌어 주는 완충 장치로 보는 편이 정확하다. 측정도 까다로워서, 같은 밭 안에서도 지점마다 값이 크게 달라 변화를 잡아내려면 여러 해에 걸친 반복 측정이 필요하다."
  },
  "E1-V-20": {

  "E2-V-01": {
    kind: "passage",
    label: "[1] 다음 글을 읽고 물음에 답하시오.",
    text: "경제학에서 말하는 '한계'는 마지막 한 단위가 가져오는 변화를 뜻한다. 이 개념이 중요한 이유는 평균과 자주 어긋나기 때문이다. 어떤 공장의 평균 생산비가 개당 만 원이라 해도, 한 개를 더 만드는 데 드는 돈은 이미 설비가 갖춰져 있으면 훨씬 적다. 반대로 설비가 한계에 다다랐다면 한 개를 더 만들기 위해 새 설비를 들여야 하므로 비용이 급격히 뛴다. 의사결정은 평균이 아니라 한계에서 이루어진다. 지금 한 단위를 더 할지 말지는 그 한 단위가 가져올 편익과 비용을 견주는 문제이며, 이미 지출한 돈이나 지금까지의 평균은 이 계산에 들어가지 않는다. 평균으로 판단하면 팔수록 손해인 제품을 계속 만들거나, 팔면 이득인 제품을 접는 일이 벌어진다. 경제학의 많은 결론이 상식과 어긋나 보이는 것은 판단의 기준점을 평균에서 한계로 옮겨 놓기 때문이다."
  },
  "E2-V-02": {
    kind: "passage",
    label: "[2] 다음 글을 읽고 물음에 답하시오.",
    text: "재판에서 목격자 진술은 오랫동안 가장 강력한 증거로 여겨졌다. 그러나 기억 연구가 쌓이면서 이 믿음은 흔들렸다. 기억은 녹화된 장면을 꺼내 보는 일이 아니라 단서를 바탕으로 매번 다시 구성하는 일에 가깝다. 그래서 사건 이후에 접한 정보가 기억 안으로 섞여 들어가고, 되풀이해 진술할수록 처음의 불확실함이 확신으로 굳어진다. (        ) 오히려 확신에 찬 진술일수록 여러 차례 되뇌어진 결과일 수 있어, 확신의 강도와 정확도가 반대로 움직이는 경우도 보고된다. 이 때문에 수사 절차는 최초 진술을 가능한 한 이른 시점에 그대로 남기고, 이후의 질문이 기억을 덧칠하지 않도록 설계되는 방향으로 바뀌어 왔다."
  },
  "E2-V-03": {
    kind: "passage",
    label: "[3] 다음 글을 읽고 물음에 답하시오.",
    text: "항생제를 처방할 때 의사는 두 가지 오류 사이에서 판단한다. 세균 감염인데 처방하지 않으면 환자가 위험해지고, 세균 감염이 아닌데 처방하면 내성균을 키운다. 개별 진료실에서는 앞의 오류가 눈앞의 위험으로 다가오고 뒤의 오류는 먼 훗날 사회 전체의 문제로 흩어진다. 그래서 각 의사가 합리적으로 판단해도 전체적으로는 처방이 과해지는 쪽으로 기운다. 이 구조를 바꾸려면 판단의 부담을 개인에게서 덜어 내야 한다. 세균 감염 여부를 진료실에서 몇 분 안에 가려 주는 신속 검사가 보급되면, 의사는 불확실을 떠안은 채 결정하지 않아도 된다. 실제로 신속 검사를 도입한 지역에서 처방률이 뚜렷이 떨어졌는데, 의사의 인식이 바뀌어서가 아니라 결정의 조건이 바뀌었기 때문이다."
  },
  "E2-V-04": {
    kind: "passage",
    label: "[4] 다음 글을 읽고 물음에 답하시오.",
    text: "도서관이 장서를 늘리는 대신 다른 기관의 자료를 빌려 오는 협력망에 기대기 시작한 것은 오래되었다. 이 방식은 한 도서관이 모든 자료를 갖출 필요를 없애 예산을 아껴 주지만, 조용히 대가를 치른다. 무엇을 소장할지 정하는 일은 무엇이 오래 남을지를 정하는 일이기도 한데, 모두가 남이 갖고 있으리라 믿고 사지 않으면 어느 곳에도 남지 않는 자료가 생긴다. 실제로 협력망이 촘촘해진 뒤 특정 분야의 마지막 한 부가 폐기되는 사례가 보고되었다. 개별 도서관의 선택은 저마다 합리적이었지만 합쳐진 결과는 누구도 의도하지 않은 공백이었다. 최근에는 협력망 안에서 '이 자료는 우리가 끝까지 보관한다'고 미리 나누어 약속하는 방식이 논의된다. 효율을 위해 만든 연결망이 보존을 위해 다시 역할을 나누는 셈이다."
  },
  "E2-V-05": {
    kind: "passage",
    label: "[5] 다음 글을 읽고 물음에 답하시오.",
    text: "태양광 발전의 경제성을 따질 때 설비 가격만 보면 그림이 절반만 보인다. 발전 단가가 아무리 낮아져도 전기가 필요한 시각과 해가 떠 있는 시각이 어긋나면 남는 전기는 값이 떨어지고 모자라는 시각에는 다른 발전원을 세워 두어야 한다. 이 어긋남의 비용은 보급 초기에는 거의 없다가 비중이 커질수록 빠르게 늘어난다. 낮 시간대 공급이 몰리면 그 시간의 도매 가격이 내려가, 뒤에 들어오는 설비일수록 같은 발전량으로 버는 돈이 줄어들기 때문이다. 그래서 어떤 나라에서는 설비 가격이 계속 떨어지는데도 신규 투자가 둔해지는 구간이 나타난다. 저장 장치나 수요를 옮기는 수단이 함께 늘어나야 이 구간을 넘어설 수 있다."
  },
  "E2-V-06": {
    kind: "passage",
    label: "[6] 다음 글을 읽고 물음에 답하시오.",
    text: "조직의 성과를 지표로 관리하기 시작하면 지표는 곧 목표가 된다. 콜센터에서 통화 시간을 줄이라고 하면 통화 시간은 줄지만 같은 문제로 다시 전화하는 비율이 오르고, 병원에서 대기 시간을 재면 접수 절차가 나뉘어 대기 시간이 여러 토막으로 쪼개진다. 지표를 속인 것이 아니라 지표가 가리키는 방향으로 움직인 결과다. (        ) 지표는 보고자 하는 것의 일부만 담아내는데, 관리가 그 일부에 상을 걸면 나머지는 조용히 희생된다. 그래서 지표를 설계할 때는 무엇을 재는가보다 그 지표가 높아질 때 함께 나빠질 수 있는 것이 무엇인지를 먼저 적어 두는 편이 낫다."
  },
  "E2-V-07": {
    kind: "passage",
    label: "[7] 다음 문단을 읽고 물음에 답하시오.",
    text: "(가) 이 방식은 실제로 초기 몇 해 동안 어획량을 회복시켰다. 배가 줄자 남은 배의 조업량이 늘어 어민 소득도 유지되었다.\n(나) 그러나 배 한 척당 잡는 능력이 빠르게 좋아지면서 척수 제한은 곧 무력해졌다. 배는 줄었는데 총 어획량은 다시 늘었다.\n(다) 남획을 막기 위해 처음 도입된 규제는 배의 수를 제한하는 것이었다. 잡는 주체를 줄이면 잡히는 양도 줄어들 것이라는 전제였다.\n(라) 그래서 규제의 대상은 배에서 물고기로 옮겨 갔다. 총 허용 어획량을 먼저 정하고 그 안에서 몫을 나누는 방식이다."
  },
  "E2-V-08": {
    kind: "passage",
    label: "[8] 다음 글을 읽고 물음에 답하시오.",
    text: "번역에서 직역과 의역의 대립은 오래된 주제지만, 실무에서는 이 구분이 잘 쓰이지 않는다. 번역자가 실제로 고르는 것은 문장 단위의 충실함이 아니라 '무엇을 잃을 것인가'이기 때문이다. 원문의 말맛을 살리면 정보의 정밀함이 깎이고, 정보를 정밀하게 옮기면 문장의 리듬이 무너진다. 어느 쪽도 완전히 지킬 수 없으므로 번역은 손실의 배분이다. 그래서 같은 원문이라도 쓰임에 따라 다른 번역이 정답이 된다. 계약서라면 리듬을 버리고 정밀함을 택하고, 광고 문구라면 정밀함을 버리고 인상을 택한다. 직역이냐 의역이냐를 묻는 대신 이 번역이 무엇을 위해 쓰이는지를 먼저 묻는 편이 실제 판단에 가깝다."
  },
  "E2-V-09": {
    kind: "passage",
    label: "[9] 다음 글을 읽고 물음에 답하시오.",
    text: "도시에서 자전거 도로를 늘리면 자전거 이용이 늘어난다는 것은 여러 도시에서 확인되었다. 다만 늘어난 이용자가 어디에서 왔는지는 도시마다 달랐다. 어떤 도시에서는 자동차로 다니던 사람이 자전거로 옮겨 왔고, 다른 도시에서는 걷거나 버스를 타던 사람이 옮겨 왔다. 앞의 경우 도로 혼잡과 배출이 함께 줄지만, 뒤의 경우 혼잡은 그대로이고 버스 이용이 줄어 노선 유지가 어려워진다. 두 경우를 가른 것은 자전거 도로의 길이가 아니라 자동차 이용의 조건이었다. 주차가 쉽고 통행료가 없는 도시에서는 자동차를 포기할 이유가 없으므로, 자전거 도로는 자동차가 아니라 도보와 버스에서 이용자를 데려온다. 자전거 정책의 효과는 자전거 쪽의 투자만으로 정해지지 않는다."
  },
  "E2-V-10": {
    kind: "passage",
    label: "[10] 다음 글을 읽고 물음에 답하시오.",
    text: "고고학에서 유물의 연대를 정하는 방법은 크게 두 갈래다. 하나는 층위를 따지는 상대 연대로, 아래에 깔린 것이 먼저라는 원칙에 기대 순서를 정한다. 다른 하나는 방사성 동위원소의 붕괴처럼 물리적 과정을 이용해 햇수를 직접 재는 절대 연대다. 상대 연대는 순서만 알려 주지만 어떤 유적에서도 쓸 수 있고, 절대 연대는 햇수를 주지만 시료가 오염되지 않아야 하고 측정 가능한 물질이 남아 있어야 한다. 두 방법은 대체 관계가 아니라 서로를 검산한다. 절대 연대가 층위 순서와 어긋나면 시료가 섞였을 가능성을 먼저 의심하고, 층위가 교란된 유적에서는 절대 연대가 순서를 바로잡는다. 연대 측정의 신뢰는 한 방법의 정밀도가 아니라 두 방법이 서로 맞물리는 데서 나온다."
  },
  "E2-V-11": {
    kind: "passage",
    label: "[11] 다음 글을 읽고 물음에 답하시오.",
    text: "대규모 공사에서 일정이 늦어지는 원인을 조사하면 개별 공정의 지연보다 공정 사이의 연결에서 더 많은 시간이 샌다. 선행 공정이 하루 늦으면 후속 공정은 인력과 장비를 이미 다른 현장에 배치해 놓았으므로 하루가 아니라 사나흘을 기다린다. 각 공정은 저마다 여유 시간을 확보해 두지만, 그 여유는 자기 공정 안에서만 쓰인다. 전체로 보면 여유가 곳곳에 흩어져 있는데도 어느 지점의 지연도 흡수하지 못한다. 그래서 공정 관리의 초점은 개별 공정을 빠르게 하는 데서 여유를 한곳에 모아 두는 쪽으로 옮겨 갔다. 각 공정의 여유를 걷어 내 전체 일정의 끝에 공동의 완충 구간을 두고, 지연이 생기면 그 구간에서 꺼내 쓰는 방식이다. 같은 양의 여유라도 흩어 두면 사라지고 모아 두면 쓸 수 있다."
  },
  "E2-V-12": {
    kind: "passage",
    label: "[12] 다음 글을 읽고 물음에 답하시오.",

  "E2-V-16": {

  "E3-V-01": {
    kind: "passage",
    label: "[1] 다음 글을 읽고 물음에 답하시오.",
    text: "과학에서 재현은 같은 실험을 되풀이해 같은 결과를 얻는 일로 이해된다. 그런데 무엇을 '같은 실험'으로 볼지가 간단하지 않다. 시약의 제조사, 실험실의 온도, 세포를 얼마나 오래 배양했는지까지 모두 같아야 한다면 재현은 사실상 불가능하다. 반대로 핵심 절차만 같으면 된다고 보면, 결과가 달라졌을 때 그것이 원래 주장이 틀린 탓인지 조건이 달라진 탓인지 가릴 수 없다. 재현 실패를 둘러싼 논쟁이 좀처럼 정리되지 않는 것은 이 경계가 미리 정해져 있지 않기 때문이다. 최근에는 논문에 결과만이 아니라 '이 결과가 성립하려면 무엇이 같아야 하는가'를 함께 적자는 제안이 나온다. 재현 가능성을 결과의 속성이 아니라 주장의 범위를 밝히는 일로 옮겨 놓는 셈이다."
  },
  "E3-V-02": {
    kind: "passage",
    label: "[2] 다음 글을 읽고 물음에 답하시오.",
    text: "기업이 사회적 책임 활동을 늘리면 평판이 좋아진다는 관찰은 많다. 그런데 순서를 뒤집어 보면 다른 설명도 가능하다. 여유가 있는 기업일수록 그런 활동에 돈을 쓸 수 있고, 여유가 있다는 것은 이미 사업이 잘된다는 뜻이다. 즉 활동이 성과를 만든 것이 아니라 성과가 활동을 가능하게 했을 수 있다. (        ) 실제로 경기가 나빠진 해에 기업들이 가장 먼저 줄인 예산이 이 항목이었다는 조사가 이를 뒷받침한다. 인과의 방향을 가리려면 활동의 규모가 외부 요인으로 갑자기 달라진 경우를 찾아, 그 변화가 이후 성과에 어떤 차이를 남겼는지 보아야 한다."
  },
  "E3-V-03": {
    kind: "passage",
    label: "[3] 다음 글을 읽고 물음에 답하시오.",
    text: "도로의 제한 속도를 낮추면 사고가 줄어든다는 것은 여러 나라에서 확인되었다. 다만 표지판만 바꾼 구간과 도로 구조까지 함께 바꾼 구간 사이에는 큰 차이가 있었다. 표지판만 바꾼 곳에서는 실제 주행 속도가 거의 내려가지 않았다. 운전자는 표지판이 아니라 차로 폭, 시야 거리, 노면의 질감에서 적정 속도를 읽어 내기 때문이다. 넓고 곧은 도로에서 낮은 제한 속도는 지켜지지 않고 단속 대상만 늘린다. 반대로 차로를 좁히고 교차로를 좁게 만들면 표지판을 바꾸지 않아도 주행 속도가 내려간다. 규칙과 환경이 어긋날 때 사람은 환경을 따른다. 속도 정책의 성패는 규칙의 엄격함보다 도로가 몸으로 말해 주는 속도를 어떻게 바꾸느냐에 달려 있다."
  },
  "E3-V-04": {
    kind: "passage",
    label: "[4] 다음 글을 읽고 물음에 답하시오.",
    text: "의료 영상 판독을 돕는 소프트웨어가 병원에 들어오면서 판독 시간이 줄었다는 보고가 이어졌다. 그런데 같은 기간 판독 정확도는 기대만큼 오르지 않았고, 일부 항목에서는 오히려 떨어졌다. 조사해 보니 소프트웨어가 '이상 없음'으로 표시한 영상에서 사람이 놓치는 병변이 늘어 있었다. 기계가 먼저 걸러 준다는 사실이 사람의 주의를 무디게 만든 것이다. 이 현상은 판독자의 능력이 떨어져서 생긴 것이 아니라, 두 판단자가 이어져 있을 때 뒤에 있는 쪽의 경계가 느슨해지는 구조에서 온다. 그래서 최근에는 소프트웨어의 판정을 먼저 보여 주지 않고 사람이 먼저 읽은 뒤 대조하도록 순서를 바꾼 병원이 늘었다. 도구를 어디에 놓느냐가 도구의 성능만큼 결과를 좌우한다."
  },
  "E3-V-05": {
    kind: "passage",
    label: "[5] 다음 글을 읽고 물음에 답하시오.",
    text: "도시 열섬을 줄이려고 건물 옥상에 흰색 도료를 칠하는 방법이 널리 쓰인다. 햇빛을 반사해 표면 온도를 낮추는 원리다. 효과는 분명하지만 조건이 붙는다. 반사된 빛의 일부는 주변 건물의 벽면으로 향해 그쪽의 냉방 부하를 올린다. 건물이 촘촘한 구역에서는 이 되돌아온 열이 무시하기 어려울 만큼 커진다. 또 겨울에는 같은 반사가 난방 부하를 키우므로, 냉방 기간이 짧은 지역에서는 연간 에너지 수지가 오히려 나빠질 수 있다. 그래서 최근에는 계절에 따라 반사율이 달라지는 도료나, 옥상 녹화처럼 증발을 이용하는 방식이 함께 검토된다. 증발 방식은 반사와 달리 열을 되돌려 보내지 않고 수증기로 바꾸어 내보낸다."
  },
  "E3-V-06": {
    kind: "passage",
    label: "[6] 다음 글을 읽고 물음에 답하시오.",
    text: "자격시험의 합격선을 정할 때 흔히 쓰는 방법은 응시자 성적 분포에서 상위 몇 퍼센트를 끊는 것이다. 운영은 간편하지만, 이 방식은 합격의 기준을 응시자 집단에 맡긴다. 같은 실력으로도 그해 응시자가 우수하면 떨어지고 그렇지 않으면 붙는다. (        ) 그래서 자격이 특정 업무 수행 능력을 보증해야 하는 시험에서는 절대 기준을 쓴다. 이 경우 문항마다 '최소한의 능력을 갖춘 사람이라면 맞힐 확률'을 전문가가 추정해 합쳐 기준점을 만든다. 추정에 주관이 섞인다는 약점이 있지만, 적어도 기준이 해마다 응시자에 따라 흔들리지는 않는다."
  },
  "E3-V-07": {
    kind: "passage",
    label: "[7] 다음 문단을 읽고 물음에 답하시오.",
    text: "(가) 문제는 이 방식이 사용자의 관심을 한 번 잡으면 놓지 않도록 설계되어, 원래 찾으려던 것에서 점점 멀어지게 만든다는 데 있었다.\n(나) 초기 인터넷 서비스는 사용자가 무엇을 찾는지 직접 입력하면 그에 맞는 결과를 돌려주는 방식이었다. 질문이 있어야 답이 나왔다.\n(다) 그래서 최근에는 추천을 끄거나, 추천의 근거를 보여 주고 사용자가 직접 조정하게 하는 기능이 다시 등장하고 있다.\n(라) 이후 서비스는 묻지 않아도 먼저 내미는 쪽으로 옮겨 갔다. 무엇을 찾을지 모르는 사용자에게도 볼거리를 건넬 수 있게 된 것이다."
  },
  "E3-V-08": {
    kind: "passage",
    label: "[8] 다음 글을 읽고 물음에 답하시오.",
    text: "농업에서 품종을 통일하면 관리가 쉬워지고 수확량이 오른다. 같은 시기에 심고 같은 시기에 거두며, 기계와 비료와 농약을 한 규격으로 맞출 수 있다. 실제로 20세기의 수확량 증가는 상당 부분 이 통일에서 나왔다. 대가는 병해에 대한 취약함이다. 한 품종이 특정 병원균에 약하면 그 밭 전체가 동시에 무너진다. 유전적으로 고른 집단에는 버텨 낼 개체가 남아 있지 않기 때문이다. 그래서 종자 은행이 야생종과 재래종을 보존하는 일은 취미가 아니라 보험에 가깝다. 지금 쓰이지 않는 품종이 앞으로 나타날 병원균에 대한 저항성을 갖고 있을 수 있는데, 어떤 저항성이 필요해질지는 미리 알 수 없다. 다양성의 값은 평소에는 보이지 않다가 필요한 순간에만 드러난다."
  },
  "E3-V-09": {
    kind: "passage",
    label: "[9] 다음 글을 읽고 물음에 답하시오.",
    text: "디지털 기기의 배터리 수명을 늘리려면 완전 충전과 완전 방전을 피하라는 조언이 널리 퍼져 있다. 근거는 분명하다. 리튬이온 전지는 전압이 높거나 낮은 양 끝에서 내부 화학 반응이 빨라져 용량이 빨리 준다. 그런데 이 조언을 그대로 따르면 실제 쓸 수 있는 구간이 좁아져 한 번 충전으로 쓰는 시간이 줄어든다. 사용자는 대신 충전 횟수를 늘리게 되고, 충전 횟수는 그 자체로 수명을 깎는다. 즉 양 끝을 피해 얻는 이득과 충전이 잦아져 잃는 손실이 맞선다. 제조사가 소프트웨어로 충전 상한을 조절하는 기능을 넣으면서도 기본값을 100%로 두는 것은 이 맞섬 때문이다. 어느 쪽이 유리한지는 사용자가 하루에 얼마나 쓰는지에 달려 있다."
  },
  "E3-V-10": {
    kind: "passage",
    label: "[10] 다음 글을 읽고 물음에 답하시오.",
    text: "언어가 사고를 규정한다는 주장은 오랫동안 매혹적이면서도 증명하기 어려운 가설이었다. 강한 형태로 읽으면, 어떤 언어에 색을 가리키는 낱말이 적으면 그 언어 사용자는 색을 구분하지 못한다는 말이 된다. 실험은 이 형태를 지지하지 않았다. 낱말이 없어도 구분은 가능했다. 다만 구분에 걸리는 시간과 기억에 남는 정도에서는 차이가 나타났다. 낱말이 있는 쪽이 더 빨리 가르고 더 오래 기억했다. 그래서 지금의 정리는 언어가 사고를 만들어 내지는 않지만 사고를 특정 방향으로 기울인다는 쪽이다. 가설의 강한 형태를 버리고 약한 형태를 남기는 이 조정은 드문 일이 아니다. 검증 가능한 크기로 주장을 줄이는 과정이 곧 그 주장을 과학의 영역으로 들여오는 과정이다."
  },
  "E3-V-11": {
    kind: "passage",
    label: "[11] 다음 글을 읽고 물음에 답하시오.",
    text: "창고형 매장이 값을 낮출 수 있는 이유로 흔히 대량 매입이 꼽힌다. 틀린 말은 아니지만 절반만 맞다. 더 큰 몫은 취급 품목 수를 줄이는 데서 나온다. 같은 종류의 상품을 서너 가지만 두면 한 품목당 판매량이 커지고, 공급자와의 협상력이 올라가며, 재고를 예측하기 쉬워져 팔리지 않는 물건에 묶이는 돈이 줄어든다. 진열과 보충에 드는 손도 함께 준다. 반대로 품목을 늘리면 선택의 폭은 넓어지지만 낱낱의 회전이 느려져 비용 구조가 흐트러진다. 소비자가 체감하는 '싸다'는 느낌은 매입 규모보다 이 단순함에서 나온다. 매장을 넓히는 일과 품목을 늘리는 일은 전혀 다른 결정이며, 앞의 것만 따라 하고 뒤의 것을 거스르면 구조가 성립하지 않는다."
  },
  "E3-V-12": {
    kind: "passage",
    label: "[12] 다음 글을 읽고 물음에 답하시오.",
    text: "고대 도시의 상수도 유적을 보면 물을 끌어오는 수로보다 물을 나누는 장치에 더 정교한 기술이 쓰였다. 먼 곳에서 물을 끌어오는 일은 경사만 맞추면 되지만, 여러 구역에 정해진 비율로 나누려면 유량을 일정하게 유지해야 하기 때문이다. 수압이 변하면 나뉘는 비율도 흔들린다. 그래서 분배 지점 앞에는 물을 잠시 가두어 수위를 일정하게 만드는 통이 놓였다. 이 통의 높이가 분배 비율을 결정했고, 통의 위치를 옮기는 것은 곧 권력의 재배치였다. 물을 어디에 얼마나 보낼지는 기술 문제이면서 동시에 정치 문제였다. 유적에서 통의 구조가 여러 차례 고쳐진 흔적이 발견되는 것은 그 도시의 세력 관계가 바뀔 때마다 배분이 다시 정해졌음을 보여 준다."
  },
  "E3-V-13": {
    kind: "passage",
    label: "[13] 다음 글을 읽고 물음에 답하시오.",
    text: "온라인 강의의 수료율이 낮다는 지적은 꾸준했다. 흔한 해석은 학습자의 의지가 약하다는 것이지만, 기록을 뜯어보면 다른 그림이 나온다. 이탈이 몰리는 지점은 강의 초반이 아니라 첫 과제가 나오는 시점이었다. 그 전까지는 영상만 보면 되었으나 과제부터는 결과물을 내놓아야 하고, 그 결과물이 다른 수강생에게 보인다. 이탈의 원인은 지루함이 아니라 평가에 노출되는 부담이었다. 이 해석이 맞는다면 처방도 달라진다. 영상을 짧게 자르거나 알림을 자주 보내는 대신, 첫 과제를 익명으로 제출하게 하거나 점수 대신 의견만 돌려주는 방식이 수료율을 올린다. 실제로 첫 과제의 평가 방식만 바꾼 강좌에서 이탈이 뚜렷이 줄었다."
  },
  "E3-V-14": {
    kind: "passage",
    label: "[14] 다음 글을 읽고 물음에 답하시오.",
    text: "박물관의 유물 반환 논의에서 자주 등장하는 논거는 보존 능력이다. 원래 지역보다 현재 소장처가 유물을 더 잘 보존할 수 있으므로 그대로 두는 편이 인류 전체에 이롭다는 주장이다. 이 논거는 한때 설득력이 있었지만 지금은 사정이 달라졌다. (        ) 게다가 보존 능력을 기준으로 삼으면 소유의 근거가 능력에 따라 계속 옮겨 다니게 되어, 애초에 어떻게 취득했는가라는 물음이 사라진다. 최근의 합의는 보존 능력과 소유 근거를 분리해 다루는 쪽이다. 반환하되 보존을 위한 기술과 인력을 함께 지원하거나, 소유권은 원래 지역에 두고 전시는 공동으로 하는 방식이 시도된다."
  },
  "E3-V-15": {
    kind: "passage",
    label: "[15] 다음 글을 읽고 물음에 답하시오.",
    text: "공장의 불량을 줄이려는 노력은 대개 검사를 강화하는 쪽으로 간다. 그러나 검사는 이미 만들어진 불량을 걸러 낼 뿐 만들어지는 것을 막지는 못한다. 검사를 아무리 촘촘히 해도 불량률 자체는 그대로이고, 늘어나는 것은 폐기 비용과 검사 인력이다. 더 큰 문제는 검사를 믿게 되면서 공정 쪽의 긴장이 풀린다는 점이다. 뒤에서 걸러 준다는 전제가 있으면 앞 공정은 조금 느슨해져도 된다고 판단하게 된다. 결국 검사 강화가 불량률을 올리는 경우까지 생긴다. 불량을 줄이는 확실한 길은 검사를 늘리는 것이 아니라 어느 공정의 어떤 변수가 흔들릴 때 불량이 나는지를 찾아 그 변수를 잡는 것이다. 걸러 내는 일과 만들지 않는 일은 전혀 다른 작업이다."
  },
  "E3-V-16": {
    kind: "passage",
    label: "[16] 다음 글을 읽고 물음에 답하시오.",
    text: "어떤 자격이나 지위를 얻는 데 드는 비용이 높으면, 그 비용 자체가 신호로 작동한다. 능력이 있는 사람은 비용을 치르고도 이익이 남지만 없는 사람은 그렇지 않으므로, 비용을 치렀다는 사실이 능력을 알려 준다는 것이다. 이 구조에서 중요한 것은 비용의 크기가 아니라 능력에 따라 비용의 부담이 다르다는 점이다. 누구에게나 똑같이 힘든 절차는 신호가 되지 못한다. 반대로 능력이 있는 사람에게 유독 덜 힘든 절차라면 액수가 작아도 신호로 기능한다. 그래서 신호 장치를 설계할 때 물어야 할 것은 '얼마나 어렵게 만들 것인가'가 아니라 '누구에게 더 어렵게 만들 것인가'다."
  },
  "E3-V-17": {
    kind: "passage",
    label: "[17] 다음 글을 읽고 물음에 답하시오.",

  "E4-V-01": {
    kind: "passage",
    label: "[1] 다음 글을 읽고 물음에 답하시오.",
    text: "법에서 '고의'와 '과실'을 가르는 일은 겉보기보다 까다롭다. 마음속을 들여다볼 수 없으므로, 실제로는 행위자가 처한 상황에서 보통 사람이라면 결과를 예견할 수 있었는지를 따진다. 즉 내면의 상태를 묻는 형식을 띠지만 판단의 재료는 바깥의 정황이다. 이 구조 때문에 같은 마음으로 한 행위라도 직업이나 지위에 따라 다르게 평가된다. 의사나 기술자처럼 전문 지식이 요구되는 자리에 있으면 예견할 수 있었다고 보는 범위가 넓어진다. 고의와 과실의 경계가 사람마다 다르게 그어지는 것은 법이 자의적이어서가 아니라, 예견 가능성이라는 기준 자체가 그 사람이 놓인 자리와 함께 정해지기 때문이다."
  },
  "E4-V-02": {
    kind: "passage",
    label: "[2] 다음 글을 읽고 물음에 답하시오.",
    text: "기업이 신제품 가격을 정할 때 원가에 일정 비율을 붙이는 방식이 오래 쓰였다. 계산이 간단하고 손해를 볼 일이 없다는 것이 장점이다. 그러나 이 방식은 소비자가 그 제품에 얼마를 낼 의향이 있는지를 전혀 묻지 않는다. 원가가 낮은 제품은 지나치게 싸게 팔려 남길 수 있었던 몫을 놓치고, 원가가 높은 제품은 팔리지 않는다. (        ) 그래서 최근에는 먼저 소비자가 인정하는 값을 조사해 목표 가격을 정하고, 그 가격에서 원하는 이익을 뺀 금액을 원가 상한으로 삼아 설계와 조달을 맞추는 방식이 쓰인다. 계산의 출발점이 원가에서 가치로 옮겨 간 것이다."
  },
  "E4-V-03": {
    kind: "passage",
    label: "[3] 다음 글을 읽고 물음에 답하시오.",
    text: "신약 개발에서 실패는 대부분 마지막 단계에서 일어난다. 동물 실험과 초기 임상을 통과한 뒤 대규모 임상에서 효과가 확인되지 않는 것이다. 여기까지 오는 데 든 비용이 워낙 커서 한 번의 실패가 회사 전체를 흔든다. 그래서 업계는 실패를 앞당기려 애쓴다. 어차피 떨어질 후보라면 돈이 덜 든 단계에서 떨어뜨리는 편이 낫기 때문이다. 초기 단계의 기준을 더 엄격히 하면 살아남는 후보가 줄지만 남은 후보의 성공률은 올라간다. 다만 기준을 지나치게 높이면 초기 지표가 나쁘지만 나중에 효과를 보였을 후보까지 잘려 나간다. 어디에서 자를지는 통과율과 후기 성공률을 함께 보아야 정해진다."
  },
  "E4-V-04": {
    kind: "passage",
    label: "[4] 다음 글을 읽고 물음에 답하시오.",
    text: "전기차가 늘면 전력 수요가 급증해 발전 설비를 크게 늘려야 한다는 우려가 있다. 총량만 보면 그럴듯하지만 충전 시각을 함께 보면 그림이 달라진다. 자동차는 하루 대부분을 세워 둔 채 보내고, 충전에 필요한 시간은 그 가운데 일부다. 언제 충전할지 고를 수 있다면 수요가 몰리는 저녁을 피해 심야나 한낮으로 옮길 수 있다. 그렇게 되면 기존 설비의 빈 시간이 채워져 설비 이용률이 오르고, 새 설비를 세울 필요는 오히려 줄어든다. 문제는 아무 신호도 없으면 사람들이 퇴근 직후 한꺼번에 꽂는다는 점이다. 그래서 시간대별 요금이나 자동 충전 예약처럼 시각을 옮길 이유를 만들어 주는 장치가 설비 증설보다 먼저 논의된다."
  },
  "E4-V-05": {
    kind: "passage",
    label: "[5] 다음 글을 읽고 물음에 답하시오.",
    text: "소리를 물리적으로 줄이는 방법과 사람이 덜 거슬리게 만드는 방법은 다르다. 같은 크기의 소리라도 성분에 따라 불쾌감이 크게 달라지기 때문이다. 낮은 주파수 성분이 많은 소리는 벽을 잘 통과해 실내에서 더 크게 들리고, 갑자기 커졌다 작아지는 소리는 평탄한 소리보다 훨씬 거슬린다. 그래서 소음 대책에서 총 음압을 몇 데시벨 낮췄는지만 보고하면 실제 체감과 어긋난다. 최근의 기준은 총량과 함께 변동의 폭과 저주파 성분의 비중을 따로 제시하도록 한다. 다만 측정 항목이 늘면 기준을 맞췄는지 다투기도 쉬워져, 항목을 늘리는 일과 분쟁을 줄이는 일은 서로 맞선다."
  },
  "E4-V-06": {
    kind: "passage",
    label: "[6] 다음 글을 읽고 물음에 답하시오.",
    text: "한 지역의 소득 분포를 하나의 숫자로 요약하려면 평균과 중앙값 가운데 하나를 고르게 된다. 평균은 전체 소득을 인원으로 나눈 값이고, 중앙값은 줄을 세웠을 때 한가운데 있는 사람의 소득이다. 소득처럼 위쪽으로 길게 늘어진 분포에서는 두 값이 크게 벌어진다. 극소수의 아주 높은 소득이 평균을 끌어올리지만 중앙값은 거의 움직이지 않기 때문이다. (        ) 그래서 '평균 소득이 올랐다'는 발표와 '살림이 나아진 것 같지 않다'는 체감이 동시에 성립할 수 있다. 두 숫자는 서로 다른 질문에 답하므로, 어느 쪽이 옳은지를 다투기보다 무엇을 묻고 있는지를 먼저 분명히 하는 편이 낫다."
  },
  "E4-V-07": {
    kind: "passage",
    label: "[7] 다음 문단을 읽고 물음에 답하시오.",
    text: "(가) 그러나 표본을 늘리는 방식은 비용이 인원수에 비례해 늘어나는 데다, 응답을 거부하는 집단이 따로 있으면 아무리 늘려도 그 편향은 사라지지 않았다.\n(나) 여론조사의 정확도를 높이는 방법으로 오랫동안 제시된 것은 표본을 크게 하는 일이었다. 더 많은 사람에게 물으면 오차가 줄어든다는 논리였다.\n(다) 지금의 조사는 규모보다 구성에 힘을 쏟는다. 적은 표본이라도 집단별 비율을 실제 인구에 맞추고, 응답률이 낮은 집단에는 가중치를 주어 보정한다.\n(라) 실제로 대규모 조사가 소규모 조사보다 크게 빗나간 사례가 이어지면서, 문제는 인원수가 아니라 누가 응답하느냐에 있다는 인식이 자리 잡았다."
  },
  "E4-V-08": {
    kind: "passage",
    label: "[8] 다음 글을 읽고 물음에 답하시오.",

    text: "경쟁 입찰에서 가장 낮은 값을 써낸 쪽이 이기는 방식은 공정해 보인다. 그러나 낙찰자는 대개 그 일의 비용을 가장 낮게 잡은 사람, 즉 가장 크게 잘못 계산한 사람이 된다. 참가자들의 추정치가 실제 비용을 중심으로 흩어져 있다면, 그중 최솟값은 평균보다 아래에 있고 실제 비용보다도 아래일 가능성이 높다. 그래서 이기고도 손해를 보는 일이 반복된다. 이를 막으려면 참가자가 자신의 추정치에 여유를 얹어 써내야 하는데, 여유를 얹으면 이길 확률이 떨어지므로 아무도 먼저 얹지 않는다. 발주자가 최저가만 보는 한 이 구조는 유지된다. 그래서 일정 수준 아래의 입찰을 아예 배제하거나, 가격과 수행 계획을 함께 평가하는 방식이 대안으로 쓰인다."
  },
  "E5-V-02": {
    kind: "passage",
    label: "[2] 다음 글을 읽고 물음에 답하시오.",
    text: "바이러스의 변이를 추적하는 일은 감시망의 촘촘함에 달려 있다. 검사와 염기서열 분석이 많이 이루어지는 나라에서는 새 변이가 빨리 발견되고, 그렇지 않은 곳에서는 늦게 발견된다. 그래서 어떤 변이가 특정 나라에서 처음 보고되었다는 사실은 그 변이가 그곳에서 생겨났다는 뜻이 아니다. (        ) 실제로 초기에 한 지역의 이름이 붙었던 변이들이 뒤늦게 다른 지역의 오래된 검체에서 더 이른 시점의 기록으로 확인된 경우가 여러 차례 있었다. 그래서 국제 기구는 지역명 대신 임의의 기호로 변이를 부르도록 권고한다. 이름이 사실을 왜곡하고, 왜곡된 사실이 다시 특정 지역에 대한 조치로 이어지기 때문이다."
  },
  "E5-V-03": {
    kind: "passage",
    label: "[3] 다음 글을 읽고 물음에 답하시오.",
    text: "근무 시간을 줄이면 생산성이 떨어질 것이라는 예상과 달리, 주 4일제를 시험한 기업들에서 산출은 대체로 유지되었다. 다만 그 이유는 사람들이 더 집중해서 일했기 때문만은 아니었다. 기록을 보면 줄어든 것은 실제 작업 시간이 아니라 회의와 대기 시간이었다. 하루가 줄자 조직은 회의를 줄이고 결재 단계를 합쳤으며, 그렇게 해도 일이 돌아간다는 사실이 드러났다. 즉 근무 시간 단축은 생산성을 끌어올린 원인이라기보다, 잘라 낼 수 있었던 군더더기를 드러낸 계기였다. 이 해석이 맞는다면, 이미 군더더기가 적은 조직에서는 같은 시도가 산출 감소로 이어질 수 있다. 결과가 조직마다 갈리는 것은 제도 자체보다 그 조직에 잘라 낼 것이 얼마나 남아 있었는지에 달려 있다."
  },
  "E5-V-04": {
    kind: "passage",
    label: "[4] 다음 글을 읽고 물음에 답하시오.",
    text: "위험을 알리는 경보는 자주 울릴수록 덜 들린다. 공장의 설비 경보를 조사한 연구에서, 하루에 수백 건의 경보가 울리는 작업장의 작업자들은 대부분의 경보를 확인하지 않고 껐다. 정작 중대한 경보도 같은 방식으로 꺼졌다. 경보를 늘린 쪽은 안전을 위한 조치라고 생각했지만, 결과는 경보 전체의 신뢰도를 깎는 일이었다. 이 현상은 경보의 민감도를 높일수록 거짓 경보가 늘어난다는 구조에서 나온다. 놓치지 않으려 할수록 헛울림이 늘고, 헛울림이 늘수록 진짜가 묻힌다. 그래서 경보 설계의 핵심은 얼마나 민감하게 만들 것인가가 아니라, 울렸을 때 사람이 무엇을 해야 하는지가 분명한 경보만 남기는 일이다."
  },
  "E5-V-05": {
    kind: "passage",
    label: "[5] 다음 글을 읽고 물음에 답하시오.",
    text: "한 나라의 식량 자급률을 높이는 일이 곧 식량 안보를 높이는 것은 아니다. 자급률은 국내 생산이 국내 소비에서 차지하는 비율인데, 이 값이 높아도 생산이 한두 작물과 몇몇 산지에 몰려 있으면 가뭄이나 병해 한 번에 전체가 흔들린다. 반대로 자급률이 낮아도 수입처가 여러 대륙에 흩어져 있고 비축이 충분하면 충격을 넘길 수 있다. 안보의 핵심은 자급의 비율이 아니라 공급이 끊길 가능성이 서로 무관한 경로를 몇 개나 갖고 있느냐다. 그래서 자급률 목표를 정하는 정책은 그 목표가 경로의 다양성을 늘리는지 줄이는지를 함께 따져야 한다. 한 작물의 자급률을 올리려고 재배지를 한곳에 집중시키면 목표는 달성되지만 안보는 나빠진다."
  },
  "E5-V-06": {
    kind: "passage",
    label: "[6] 다음 글을 읽고 물음에 답하시오.",
    text: "연구비를 배분할 때 심사위원의 평가 점수를 평균해 순위를 매기는 방식이 일반적이다. 이 방식은 극단적인 평가가 섞여도 전체가 크게 흔들리지 않는다는 장점이 있다. 그런데 평균을 쓰면 모두가 무난하다고 본 제안이 위로 올라가고, 일부가 매우 높게 평가하고 다른 일부가 낮게 평가한 제안은 가운데로 끌려 내려간다. (        ) 새로운 시도일수록 평가가 갈리기 쉬우므로, 평균 방식은 구조적으로 안전한 제안을 고르게 된다. 그래서 일부 기관은 전체 예산의 일부를 따로 떼어, 한 명이라도 최고 점수를 준 제안 가운데서 무작위로 고르는 별도 경로를 둔다. 평균이 걸러 내는 쪽을 일부러 통과시키기 위해서다."
  },
  "E5-V-07": {
    kind: "passage",
    label: "[7] 다음 문단을 읽고 물음에 답하시오.",
    text: "(가) 그러나 시간이 지나면서 이 제도는 원래 목적과 다른 곳에서 쓰이기 시작했다. 신용이 충분한 대기업이 금리를 낮추는 수단으로 활용한 것이다.\n(나) 매출채권 보험은 거래처가 대금을 치르지 못할 때 손실을 메워 주는 장치로 도입되었다. 담보가 부족한 중소기업이 외상 거래를 할 수 있게 하려는 취지였다.\n(다) 그래서 최근에는 가입 자격을 매출 규모로 제한하거나, 보험료율을 기업 규모에 따라 다르게 매기는 방향으로 제도가 손질되고 있다.\n(라) 보험에 든 채권은 위험이 낮게 평가되므로, 그 채권을 담보로 빌리면 이자가 내려간다. 정작 담보가 부족한 기업은 보험료 부담 때문에 가입하지 못했다."
  },
  "E5-V-08": {
    kind: "passage",
    label: "[8] 다음 글을 읽고 물음에 답하시오.",
    text: "건강 검진을 자주 받으면 병을 일찍 찾아 좋다는 생각은 널리 퍼져 있다. 다만 검진에는 발견하지 않아도 될 것을 발견하는 문제가 따른다. 평생 증상을 일으키지 않았을 작은 종양이나 이상 소견이 잡히면, 그 뒤로 추가 검사와 시술이 이어지고 그 과정에서 합병증이 생기기도 한다. 검진의 이득은 조기 발견으로 살린 목숨이고, 손실은 이렇게 생긴 과잉 진단과 그 처치의 피해다. 두 값의 크기는 질환마다, 연령마다 다르다. 그래서 '모두가 자주 받을수록 좋다'는 권고는 성립하지 않고, 어떤 질환을 어느 연령대에 얼마나 자주 볼 것인지가 따로 정해진다. 검진 권고안이 나라마다 다르고 몇 해마다 바뀌는 것은 이 계산이 자료에 따라 갱신되기 때문이다."
  },
  "E5-V-09": {
    kind: "passage",
    label: "[9] 다음 글을 읽고 물음에 답하시오.",
    text: "제품 후기의 평점 분포를 보면 최고점과 최저점에 몰려 있고 가운데가 비는 모양이 자주 나타난다. 이를 두고 제품의 품질 편차가 크다고 해석하기 쉽지만, 대개는 후기를 남기는 사람의 구성 때문이다. 아주 만족했거나 아주 실망한 사람만 굳이 시간을 들여 글을 쓴다. 보통이라고 느낀 다수는 아무 말도 하지 않는다. 따라서 평균 평점은 제품을 산 사람들의 평균 만족도가 아니라, 글을 쓸 만큼 감정이 움직인 사람들의 평균이다. 이 차이는 구매자 수가 많아질수록 줄어들지 않는다. 표본이 커져도 뽑히는 방식이 그대로이기 때문이다. 최근 일부 판매처가 구매자 전원에게 짧은 설문을 보내 응답을 받는 것은 이 뽑힘의 치우침을 줄이려는 시도다."
  },
  "E5-V-10": {
    kind: "passage",
    label: "[10] 다음 글을 읽고 물음에 답하시오.",
    text: "도시의 가로등을 밝게 하면 범죄가 준다는 연구와 별 차이가 없다는 연구가 함께 있다. 둘을 나란히 놓고 보면 조사 시점이 다르다. 효과가 컸다고 보고한 연구들은 조명 개선이 주민 모임이나 순찰 강화와 함께 이루어진 지역을 다루었고, 차이가 없었다는 연구들은 조명만 바꾼 지역을 다루었다. 즉 조명은 사람들이 저녁에 밖으로 나오게 만드는 여러 조건 가운데 하나일 뿐이며, 나머지 조건이 없으면 밝아진 거리는 여전히 비어 있다. 밝기 자체가 범죄를 막는 것이 아니라 밝기 덕에 늘어난 사람의 눈이 막는다. 조명을 독립 변수로 놓고 효과를 다투는 논쟁이 좀처럼 정리되지 않는 것은 이 매개 고리가 조사마다 달랐기 때문이다."
  },
  "E5-V-11": {
    kind: "passage",
    label: "[11] 다음 글을 읽고 물음에 답하시오.",
    text: "플랫폼이 판매자와 구매자를 이어 주며 받는 수수료는 겉보기에 판매자가 낸다. 그러나 실제로 누가 부담하는지는 수요와 공급이 값의 변화에 얼마나 민감한지에 따라 갈린다. 판매자가 다른 판로를 쉽게 찾을 수 있으면 수수료 인상분은 대부분 가격에 얹혀 구매자에게 넘어가고, 구매자가 값에 민감하면 판매자가 떠안는다. 법이 '수수료는 판매자가 부담한다'고 적어 두어도 이 배분은 달라지지 않는다. 명목상의 납부자와 실질적 부담자는 다른 문제이기 때문이다. 수수료 규제를 설계할 때 명목만 손대면 부담의 이동을 막지 못한다. 어느 쪽이 떠안을지는 규정이 아니라 양쪽이 얼마나 쉽게 떠날 수 있느냐가 정한다."
  },
  "E5-V-12": {
    kind: "passage",
    label: "[12] 다음 글을 읽고 물음에 답하시오.",
    text: "콘크리트는 시간이 지나면서 공기 중의 이산화탄소를 조금씩 흡수한다. 표면에서 안쪽으로 서서히 진행되는 이 반응은 생산 과정에서 배출한 양의 일부를 되돌린다. 다만 같은 반응이 내부 철근을 보호하던 알칼리 환경을 약화시켜 부식을 앞당긴다. 즉 탄소 흡수와 구조 수명은 같은 반응의 양면이다. 흡수량은 표면적에 비례하므로 잘게 부순 폐콘크리트에서 훨씬 빠르게 일어나는데, 이때는 이미 철근이 분리된 뒤라 부식 문제가 없다. 그래서 해체 단계에서 파쇄한 콘크리트를 일정 기간 노출해 두는 방식이 검토된다. 다만 이 과정에서 발생하는 분진과 운반 부담을 함께 따져야 순이득을 말할 수 있다."
  },
  "E5-V-13": {
    kind: "passage",
    label: "[13] 다음 글을 읽고 물음에 답하시오.",
    text: "번호판 인식으로 주차 요금을 매기는 무인 정산은 인건비를 줄인다. 그런데 도입한 주차장의 회수율을 보면 기대만큼 오르지 않은 곳이 있다. 인식 실패가 일정 비율로 생기는데, 실패한 차량은 그냥 빠져나가기 때문이다. 유인 정산에서는 실패해도 사람이 처리했지만 무인에서는 통과가 기본값이 된다. 인식률을 99%로 올려도 실패 1%는 남고, 그 1%가 요금이 비싼 장기 주차에 몰리면 손실은 대수가 아니다. 그래서 설계는 인식률을 끌어올리는 쪽과 실패했을 때의 기본값을 '통과'에서 '차단'으로 바꾸는 쪽으로 나뉜다. 후자는 손실을 막지만 정상 차량을 막아 세우는 불편을 만든다. 어느 쪽을 택할지는 실패 1건의 손실과 불편 1건의 비용을 견주어 정한다."
  },
  "E5-V-14": {
    kind: "passage",
    label: "[14] 다음 글을 읽고 물음에 답하시오.",
    text: "어떤 기술이 언제 상용화될지 묻는 질문에 전문가들은 대체로 낙관적으로 답한다. 과거의 예측을 되짚어 보면 실현 시점은 예측보다 한참 뒤였다. 흥미로운 것은 같은 전문가들이 그 기술의 최종적인 영향력은 오히려 과소평가했다는 점이다. 도입은 예상보다 느렸지만 일단 자리 잡은 뒤의 변화는 예상보다 컸다. (        ) 초기에는 기존 방식을 대체하는 데 드는 비용과 관성이 예측에 잘 들어가지 않고, 나중에는 그 기술 위에 새로 생기는 용도가 예측에 잘 들어가지 않기 때문이다. 그래서 기술 예측을 읽을 때는 시점과 규모를 따로 놓고 보는 편이 낫다. 두 오차는 방향이 반대다."
  },
  "E5-V-15": {
    kind: "passage",
    label: "[15] 다음 글을 읽고 물음에 답하시오.",

<script>
/* SKCT 인지역량검사 시뮬레이터 — 응시·채점·결과
 * app.js가 노출한 window.SKCT의 셸과 유틸리티를 함께 쓴다.
 */
(function () {
  "use strict";

  var S = window.SKCT;
  if (!S) return;

  var el = S.el, clamp = S.clamp, pad2 = S.pad2, mmss = S.mmss;
  var store = S.store, toast = S.toast, appbar = S.appbar, go = S.go, render = S.render;

  var SECTIONS = window.SKCT_COG_SECTIONS;
  var MATERIALS = window.SKCT_COG_MATERIALS;
  var BANK = window.SKCT_COG_BANK;
  var SETS = window.SKCT_COG_SETS;

  var SEC_BY_CODE = {};
  SECTIONS.forEach(function (s) { SEC_BY_CODE[s.code] = s; });

  var CIRCLED = "①②③④⑤";
  var BANK_VERSION = 1;
  var K_SESSION = "skct.cog.v1.session";
  var K_HISTORY = "skct.cog.v1.history";

  /* 연습용 시뮬레이션 규준 — 정답률 기준 (실제 SK 규준이 아니다) */
  var NORM_RATE = 0.58, NORM_SD = 0.17;

  var Q_BY_ID = {};
  Object.keys(BANK).forEach(function (sec) {
    BANK[sec].forEach(function (q) { q.sec = sec; Q_BY_ID[q.id] = q; });
  });

  /* 세부 유형은 문항 수가 적어 정답률이 0%/100%로만 나온다.
     약점을 읽으려면 유형군 단위로 묶어야 한다. */
  var TYPE_GROUP = {
    /* 언어이해 */
    "문장배열": "글의 구조", "빈칸추론": "글의 구조", "서술방식": "글의 구조",
    "주제파악": "주제·제목·요약", "제목": "주제·제목·요약", "요약": "주제·제목·요약",
    "내용일치": "독해·추론", "추론": "독해·추론", "적용": "독해·추론",
    /* 자료해석 */
    "자료해석": "수치 계산", "그래프분석": "수치 계산",
    "표분석": "표·그래프 판단", "모두고르시오": "표·그래프 판단",
    /* 창의수리 */
    "방정식": "방정식·비례·평균", "비례": "방정식·비례·평균", "평균": "방정식·비례·평균",
    "농도": "농도·일률·속도", "일률": "농도·일률·속도", "거리속도": "농도·일률·속도",
    "확률": "확률·경우의 수", "경우의수": "확률·경우의 수",
    "원가할인": "원가·할인·이익",
    /* 언어추리 */
    "명제·대우": "명제·논리", "삼단논법": "명제·논리", "명제연쇄": "명제·논리", "명제추론": "명제·논리",
    "조건추리": "조건·순서·배치", "순서추리": "조건·순서·배치", "배치추리": "조건·순서·배치",
    "참거짓": "진실게임",
    /* 수열추리 */
    "수규칙": "수 규칙"
  };;
  function groupOf(q) {
    return TYPE_GROUP[q.type] || (SEC_BY_CODE[q.sec] ? SEC_BY_CODE[q.sec].name : "기타");
  }

  var cog = { session: null, result: null, timerId: null, submitting: false, ui: null };

  function setDef(id) { return SETS.filter(function (s) { return s.id === id; })[0]; }

  /* ---------------- 세션 ---------------- */

  function buildParts(def) {
    return def.parts.map(function (p) {
      return { title: p.title, sec: p.sec, minutes: p.minutes, items: p.items.slice() };
    });
  }

  function newSession(setId) {
    var def = setDef(setId);
    return {
      bankVersion: BANK_VERSION,
      setId: setId,
      parts: buildParts(def),
      partIdx: 0,
      idx: 0,
      answers: {}, flags: {}, times: {},
      startedAt: null, carryMs: 0, paused: false, pausedMs: 0,
      qEnteredAt: null,
      partLog: [],
      finishedAt: null
    };
  }

  function curPart() { return cog.session.parts[cog.session.partIdx]; }
  function curItems() { return curPart().items; }
  function curQid() { return curItems()[cog.session.idx]; }

  function partElapsedMs() {
    var s = cog.session;
    if (!s || !s.startedAt) return s ? s.carryMs : 0;
    return s.paused ? s.carryMs : (Date.now() - s.startedAt) + s.carryMs;
  }
  function partRemainingSec() {
    return curPart().minutes * 60 - Math.round(partElapsedMs() / 1000);
  }

  function saveSession() {
    var s = cog.session;
    if (!s) return;
    if (s.startedAt && !s.paused && !s.finishedAt) {
      s.carryMs = partElapsedMs();
      s.startedAt = Date.now();
    }
    store(K_SESSION, s);
  }

  function isResumable(saved) {
    return !!(saved && !saved.finishedAt && saved.setId && setDef(saved.setId) &&
      saved.bankVersion === BANK_VERSION && saved.parts && saved.parts.length);
  }

  function histList() { return store(K_HISTORY) || []; }

  /* 현재 문항에 머문 시간을 누적하고 타이머를 끊는다. */
  function flushQuestionTime() {
    var s = cog.session;
    if (!s || !s.qEnteredAt) return;
    var qid = curQid();
    s.times[qid] = (s.times[qid] || 0) + (Date.now() - s.qEnteredAt);
    s.qEnteredAt = null;
  }
  function markQuestionEnter() {
    if (cog.session && !cog.session.paused) cog.session.qEnteredAt = Date.now();
  }

  /* ---------------- 일시정지 ---------------- */

  function pause() {
    var s = cog.session;
    if (!s || s.paused || cog.submitting) return;
    flushQuestionTime();
    s.carryMs = partElapsedMs();
    s.paused = true;
    s.startedAt = null;
    saveSession();
    render();
  }

  function resume() {
    var s = cog.session;
    if (!s || !s.paused) return;
    s.paused = false;
    s.startedAt = Date.now();
    saveSession();
    render();
  }

  function togglePause() { if (cog.session && cog.session.paused) resume(); else pause(); }

  /* 나가기 — 확인하는 동안 시간이 흐르면 안 되므로 먼저 멈춘다.
     '아니오'를 고르면 멈추기 전 상태로 되돌린다. */
  function leaveTest() {
    var s = cog.session;
    if (!s || cog.submitting) return;
    var wasRunning = !s.paused;
    if (wasRunning) pause();
    S.confirmBox({
      title: "정말 나가시겠습니까?",
      body: "시간은 멈춰 두었다. 지금까지 푼 내용과 남은 시간은 저장되며, 홈에서 '이어서 응시'를 누르면 멈춘 지점부터 다시 시작한다.",
      yes: "예, 나갑니다",
      no: "아니오, 계속 풉니다",
      onYes: function () { flushQuestionTime(); saveSession(); stopTimer(); go("home"); },
      onNo: function () { if (wasRunning) resume(); }
    });
  }

  /* ---------------- 개념 및 치트키 정리 ---------------- */

  var GUIDE = window.SKCT_COG_GUIDE || [];
  var guideUI = { area: "all", open: {}, list: null, toggle: null };

  /* 펼쳐진 카드 수를 세어 전체 토글 버튼의 라벨·화살표·개수를 실제 상태와 맞춘다.
     카드를 하나씩 여닫아도 버튼이 따라 움직인다. */
  function syncGuideToggle() {
    /* 아직 문서에 붙기 전(첫 조립 중)에도 세야 하므로 연결 여부는 보지 않는다. */
    var list = guideUI.list, btn = guideUI.toggle;
    if (!list || !btn) return;
    var cards = list.querySelectorAll("details.gcard");
    var open = 0;
    for (var i = 0; i < cards.length; i++) if (cards[i].open) open++;
    var allOpen = cards.length > 0 && open === cards.length;
    btn.classList.toggle("is-open", allOpen);
    btn.setAttribute("aria-pressed", String(allOpen));
    btn.querySelector(".gtoggle-t").textContent = allOpen ? "모두 접기" : "모두 펼치기";
    btn.querySelector(".gtoggle-n").textContent = open + "/" + cards.length;

    var areas = list.querySelectorAll(".garea");
    for (var a = 0; a < areas.length; a++) {
      var ab = areas[a].querySelector(".garea-toggle");
      if (!ab) continue;
      var ac = areas[a].querySelectorAll("details.gcard"), o = 0;
      for (var k = 0; k < ac.length; k++) if (ac[k].open) o++;
      var full = ac.length > 0 && o === ac.length;
      ab.textContent = full ? "이 영역 접기" : "이 영역 펼치기";
      ab.setAttribute("aria-pressed", String(full));
    }
  }

  /* 여러 카드를 한꺼번에 여닫는다. 접을 때 화면이 본문 아래로 붕 뜨지 않도록 되돌린다. */
  function setCardsOpen(cards, open) {
    for (var i = 0; i < cards.length; i++) cards[i].open = open;
    syncGuideToggle();
    if (!open && guideUI.list) {
      var r = guideUI.list.getBoundingClientRect();
      if (r.top < 0) window.scrollTo(0, window.scrollY + r.top - 120);
    }
  }

  /* 지금까지의 응시 기록에서 유형군별 정답률을 모은다. 카드에 내 성적을 붙여 두면
     어느 개념부터 볼지 고르는 데 쓸 수 있다. */
  function myGroupStats() {
    var acc = {};
    histList().forEach(function (h) {
      if (!h.full || !h.full.groups) return;
      h.full.groups.forEach(function (g) {
        var a = acc[g.group] = acc[g.group] || { correct: 0, total: 0 };
        a.correct += g.correct;
        a.total += g.total;
      });
    });
    Object.keys(acc).forEach(function (k) {

    });
    return acc;
  }

  function drillNode(d, n) {
    var box = el("div", { class: "gdrill" });
    box.appendChild(el("div", { class: "gdrill-head" }, [
      el("span", { class: "gdrill-no", text: "예상문제 " + n }),

    box.appendChild(el("p", { class: "gdrill-q", text: d.q }));
    if (d.table) box.appendChild(guideTable(d.table));

    var verdict = el("div", { class: "gverdict" });
    var explain = el("div", { class: "gexplain" }, [
      el("b", { text: "해설" }),
      el("p", { text: d.explain })
    ]);
    var reveal = el("div", { class: "greveal" }, [verdict, explain]);
    reveal.style.display = "none";

    var btns = [];
    var choices = el("div", { class: "gchoices" });
    d.choices.forEach(function (c, i) {
      var b = el("button", { class: "gchoice", type: "button" }, [
        el("span", { class: "gchoice-no", text: CIRCLED[i] }),
        el("span", { class: "gchoice-text", text: c })
      ]);
      b.addEventListener("click", function () { show(i); });
      btns.push(b);
      choices.appendChild(b);
    });

    var showBtn = el("button", { class: "linkbtn gdrill-show", type: "button", text: "그냥 정답 보기" });
    showBtn.addEventListener("click", function () { show(null); });

    function show(picked) {
      btns.forEach(function (b, i) {
        b.classList.toggle("is-answer", i === d.answer);
        b.classList.toggle("is-wrong", picked !== null && i === picked && i !== d.answer);
      });
      verdict.textContent = picked === null
        ? "정답은 " + CIRCLED[d.answer] + " 번이다."
        : (picked === d.answer ? "맞았다. 정답은 " + CIRCLED[d.answer] + " 번이다."
                               : "틀렸다. 정답은 " + CIRCLED[d.answer] + " 번이다.");
      verdict.className = "gverdict" + (picked === null ? "" : picked === d.answer ? " is-ok" : " is-no");
      reveal.style.display = "";
      showBtn.style.display = "none";
    }

    box.appendChild(choices);
    box.appendChild(showBtn);
    box.appendChild(reveal);
    return box;
  }

        }
      })
    ]));

    var wrap = el("div", { class: "wrap narrow" });
    var prev = s.partLog[s.partLog.length - 1];

    wrap.appendChild(el("div", { class: "readyscreen" }, [
      el("div", { class: "eyebrow", text: def.code + " · " + def.name }),
      el("h1", { text: part.title }),
      el("div", { class: "readymeta" }, [
        el("div", { class: "readystat" }, [
          el("span", { class: "k", text: "문항 수" }),
          el("span", { class: "v num", text: part.items.length + "문항" })
        ]),
        el("div", { class: "readystat" }, [
          el("span", { class: "k", text: "제한 시간" }),
          el("span", { class: "v num", text: part.minutes + "분" })
        ]),
        el("div", { class: "readystat" }, [
          el("span", { class: "k", text: "문항당" }),
          el("span", { class: "v num", text: Math.round(part.minutes * 60 / part.items.length) + "초" })
        ])
      ]),
      prev ? el("div", { class: "prevresult" }, [
        el("span", { text: "직전 " + prev.title + " 소요 " + mmss(prev.elapsedSec) + " · 응답 " + prev.answered + "/" + prev.total + "문항" }),
        el("span", { class: "muted", text: "채점 결과는 마지막 교시가 끝난 뒤 한 번에 나온다" })
      ]) : null,
      el("p", { class: "readydesc", text: isFirst
        ? "시작 버튼을 누르면 타이머가 돌기 시작한다. 응시 중 언제든 일시정지할 수 있고, 멈춘 시간은 기록에 포함되지 않는다."
        : "이전 교시에서 남은 시간은 넘어오지 않는다. 준비가 되면 시작 버튼을 누르면 된다." }),
      el("div", { class: "readyactions" }, [
        el("button", {
          class: "btn btn-primary", type: "button",
          text: (isFirst ? "시작하기" : "이 교시 시작하기"),
          onclick: function () {
            s.idx = 0;
            s.carryMs = 0;
            s.paused = false;
            s.startedAt = Date.now();
            saveSession();
            go("cog-test");
          }
        }),
        el("button", { class: "btn", type: "button", text: "나중에 하기", onclick: function () { saveSession(); go("home"); } })
      ]),
      el("div", { class: "kbdhint", html:
        "<kbd>1</kbd>~<kbd>5</kbd> 선택지 · <kbd>←</kbd><kbd>→</kbd> 문항 이동 · <kbd>F</kbd> 나중에 볼 문항 표시 · <kbd>P</kbd> 일시정지" })
    ]));

    frag.appendChild(wrap);
    return frag;
  }

  /* ---------------- 응시 화면 ---------------- */

  function tableNode(t) {
    var frag = document.createDocumentFragment();
    if (t.caption) frag.appendChild(el("div", { class: "material-caption", text: t.caption }));
    if (t.unit) frag.appendChild(el("div", { class: "material-unit", text: t.unit }));
    frag.appendChild(el("div", { class: "tablescroll" }, [
      el("table", { class: "datatable" }, [
        el("thead", {}, [el("tr", {}, t.head.map(function (h, i) {
          return el("th", { class: i ? "num" : "", text: h });
        }))]),
        el("tbody", {}, t.rows.map(function (r) {
          /* 합계·소계 행은 옅은 배경으로 구분해 둔다 — 실제 자료의 생김새에 가깝다. */
          var sum = /^(합계|계|소계|전체|총계)/.test(String(r[0]));
          return el("tr", { class: sum ? "is-sum" : "" },
            r.map(function (c, i) { return el("td", { class: i ? "num" : "", text: c }); }));
        }))
      ])
    ]));
    return frag;
  }

  function materialNode(mat) {
    if (!mat) return null;
    var box = el("div", { class: "material" });
    box.appendChild(el("div", { class: "material-label", text: mat.label }));
    if (mat.kind === "passage") {
      box.appendChild(el("p", { class: "material-text", text: mat.text }));
    } else if (mat.kind === "table") {
      /* tables가 있으면 표를 여러 개 얹는다 — 두 자료를 엮어 푸는 문항에 쓴다. */
      (mat.tables || [mat]).forEach(function (t) { box.appendChild(tableNode(t)); });
    } else if (mat.kind === "chart") {
      if (mat.unit) box.appendChild(el("div", { class: "material-unit", text: mat.unit }));
      chartInto(box, mat);
    }
    if (mat.note) box.appendChild(el("div", { class: "material-note", text: mat.note }));
    return box;
  }

  /* ---------------- 그래프 자료 ----------------
   * 막대는 HTML·CSS로, 꺾은선은 선만 SVG로 그리고 점과 값은 HTML로 얹는다.
   * 이렇게 하면 폭이 좁아져도 글자 크기가 그대로라 값을 읽을 수 있다.
   * 계열 색은 --chart-1 / --chart-2 두 칸만 쓰며, 라이트·다크 각각 팔레트 검사를 통과한 값이다.
   * 시험 자료이므로 모든 점에 값을 직접 붙인다. 값이 화면에 다 적혀 있어 마우스를 올려
   * 값을 확인하는 층은 따로 두지 않았다. */
  function fmtNum(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function chartInto(box, mat) {
    var series = mat.series, multi = series.length > 1;
    if (multi) {
      box.appendChild(el("div", { class: "chart-legend" }, series.map(function (sr, i) {
        return el("span", { class: "chart-lg" }, [
          el("i", { class: "chart-sw s" + (i + 1) }), el("span", { text: sr.name })
        ]);
      })));
    }
    var all = [];
    series.forEach(function (sr) { all = all.concat(sr.values); });
    var top = Math.max.apply(null, all) * 1.15 || 1;

    if (mat.chart === "line") {
      var plot = el("div", { class: "chart chart-line" });
      var n = mat.axis.length;
      var xOf = function (i) { return n === 1 ? 50 : (i / (n - 1)) * 100; };
      var yOf = function (v) { return 100 - (v / top) * 100; };
      var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("aria-hidden", "true");
      series.forEach(function (sr, si) {
        var pl = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        pl.setAttribute("points", sr.values.map(function (v, i) { return xOf(i) + "," + yOf(v); }).join(" "));
        pl.setAttribute("class", "chart-path s" + (si + 1));
        pl.setAttribute("vector-effect", "non-scaling-stroke");
        svg.appendChild(pl);
      });
      plot.appendChild(svg);
      series.forEach(function (sr, si) {
        sr.values.forEach(function (v, i) {
          plot.appendChild(el("span", { class: "chart-dot s" + (si + 1),
            style: "left:" + xOf(i) + "%; top:" + yOf(v) + "%;" }));
          /* 두 계열이 같은 값이면 점이 겹쳐 라벨이 서로를 가린다.
             첫 계열은 점 위, 둘째 계열은 점 아래에 붙여 항상 둘 다 읽히게 한다. */
          plot.appendChild(el("span", { class: "chart-val chart-val-line" + (si ? " is-below" : ""),
            style: "left:" + xOf(i) + "%; top:" + yOf(v) + "%;", text: fmtNum(v) }));
        });
      });
      box.appendChild(plot);
      box.appendChild(el("div", { class: "chart-axis" }, mat.axis.map(function (a) {
        return el("span", { text: a });
      })));
    } else {
      var bars = el("div", { class: "chart chart-bar" });
      mat.axis.forEach(function (a, i) {
        bars.appendChild(el("div", { class: "chart-group" }, [
          el("div", { class: "chart-cols" }, series.map(function (sr, si) {
            return el("div", { class: "chart-col" }, [
              el("span", { class: "chart-val", text: fmtNum(sr.values[i]) }),
              el("span", { class: "chart-bar-fill s" + (si + 1),
                style: "height:" + (sr.values[i] / top * 100).toFixed(2) + "%;",
                title: sr.name + " " + fmtNum(sr.values[i]) })
            ]);
          })),
          el("div", { class: "chart-cat", text: a })
        ]));
      });
      box.appendChild(bars);
    }
  }

  /* ㄱ·ㄴ·ㄷ 보기와 <보기> 사례를 담는 상자. 발문 바로 아래에 붙는다. */
  function boxesNode(q) {
    if (!q.boxes || !q.boxes.length) return null;
    return el("div", { class: "qboxes" }, q.boxes.map(function (b) {
      return el("p", { class: "qbox-line", text: b });
    }));
  }

  function renderTest() {
    var s = cog.session;
    var def = setDef(s.setId);
    var part = curPart();
    var items = part.items;
    s.idx = clamp(s.idx, 0, items.length - 1);
    var qid = items[s.idx];
    var q = Q_BY_ID[qid];

    var ui = { choiceBtns: [], flagBtn: null, navBtns: [], statusEl: null };

    var frag = document.createDocumentFragment();
    var timer = el("span", { class: "timer", id: "cogtimer", text: mmss(Math.max(0, partRemainingSec())) });

    frag.appendChild(appbar([
      el("div", { class: "appbar-spacer" }),
      el("span", { class: "setcode", text: part.title }),
      timer,
      el("button", {
        class: "iconbtn" + (s.paused ? " is-on" : ""), type: "button",
        text: s.paused ? "▶ 계속" : "⏸ 정지",
        title: "일시정지 / 계속 (P)",
        onclick: togglePause
      }),
      el("button", {
        class: "iconbtn", type: "button", text: "나가기",
        onclick: leaveTest
      })
    ]));

    frag.appendChild(el("div", { class: "progressbar" }, [
      el("span", { style: "width:" + ((s.idx) / items.length * 100) + "%" })
    ]));

    var wrap = el("div", { class: "wrap narrow" });

    if (s.paused) {
      wrap.appendChild(el("div", { class: "pausepanel" }, [
        el("div", { class: "pause-ico", text: "⏸" }),
        el("h2", { text: "시간이 멈춰 있다" }),
        el("p", { text: "문제는 잠시 가려 두었다. 계속 누르면 멈춘 지점에서 그대로 이어진다. 멈춰 있는 동안은 소요 시간에 잡히지 않는다." }),
        el("div", { class: "pausestats" }, [
          el("div", {}, [el("span", { class: "k", text: "남은 시간" }), el("span", { class: "v num", text: mmss(Math.max(0, partRemainingSec())) })]),
          el("div", {}, [el("span", { class: "k", text: "진행" }), el("span", { class: "v num", text: (s.idx + 1) + " / " + items.length + "문항" })]),
          el("div", {}, [el("span", { class: "k", text: "응답 완료" }), el("span", { class: "v num", text: answeredCount() + "문항" })])
        ]),
        el("div", { class: "readyactions" }, [
          el("button", { class: "btn btn-primary", type: "button", text: "▶ 계속 풀기", onclick: resume }),
          el("button", { class: "btn", type: "button", text: "나중에 하기", onclick: function () { saveSession(); go("home"); } })
        ])
      ]));
      frag.appendChild(wrap);
      cog.ui = null;
      return frag;
    }

    wrap.appendChild(el("div", { class: "testhead" }, [
      el("div", { class: "pos" }, [
        el("b", { text: String(s.idx + 1) }),
        el("span", { text: " / " + items.length + " 문항" })
      ]),
      el("div", { class: "setname", text: (SEC_BY_CODE[q.sec] ? SEC_BY_CODE[q.sec].name : part.title) + " · " + q.type })
    ]));

    var card = el("div", { class: "qcard" });
    var mat = q.material ? MATERIALS[q.material] : null;
    if (mat) card.appendChild(materialNode(mat));

    card.appendChild(el("div", { class: "stembox" }, [
      el("p", { class: "stem", text: q.stem }),
      boxesNode(q)
    ]));

    var list = el("div", { class: "choicelist" });
    q.choices.forEach(function (c, i) {
      var b = el("button", {
        class: "choice", type: "button",
        "aria-pressed": String(s.answers[qid] === i),
        onclick: function () { pick(i); }
      }, [
        el("span", { class: "choice-no", text: CIRCLED[i] }),
        el("span", { class: "choice-text", text: c })
      ]);
      ui.choiceBtns.push(b);
      list.appendChild(b);
    });
    card.appendChild(list);

    ui.flagBtn = el("button", {
      class: "flagbtn" + (s.flags[qid] ? " is-on" : ""), type: "button",
      onclick: toggleFlag,
      text: (s.flags[qid] ? "★ 표시함" : "☆ 나중에 다시 보기")
    });
    card.appendChild(el("div", { class: "qfoot" }, [
      ui.flagBtn,
      el("span", { class: "qfoot-hint", text: "확신이 없으면 표시해 두고 넘어가는 편이 낫다" })
    ]));

    wrap.appendChild(card);

    ui.statusEl = el("span", { class: "status" });
    wrap.appendChild(el("div", { class: "navrow" }, [
      el("button", {
        class: "btn", type: "button", text: "← 이전", disabled: s.idx === 0 ? "" : null,
        onclick: function () { move(-1); }
      }),
      ui.statusEl,
      el("div", { class: "spacer" }),
      s.idx === items.length - 1
        ? el("button", { class: "btn btn-primary", type: "button", text: "이 교시 마치기", onclick: function () { finishPart(false); } })
        : el("button", { class: "btn btn-primary", type: "button", text: "다음 →", onclick: function () { move(1); } })
    ]));

    var nav = el("div", { class: "qnav" });
    items.forEach(function (id, i) {
      var b = el("button", {
        class: "qnav-btn" + (i === s.idx ? " is-cur" : "") +
          (s.answers[id] !== undefined ? " is-done" : "") + (s.flags[id] ? " is-flag" : ""),
        type: "button",
        title: (i + 1) + "번" + (s.answers[id] !== undefined ? " · 응답함" : " · 미응답") + (s.flags[id] ? " · 표시함" : ""),
        text: String(i + 1),
        onclick: function () { goTo(i); }
      });
      ui.navBtns.push(b);
      nav.appendChild(b);
    });
    wrap.appendChild(el("div", { class: "qnav-wrap" }, [
      el("div", { class: "qnav-head" }, [
        el("span", { text: "문항 이동" }),
        el("span", { class: "qnav-legend" }, [
          el("span", { class: "lg lg-done" }), el("span", { text: "응답" }),
          el("span", { class: "lg lg-flag" }), el("span", { text: "표시" })
        ])
      ]),
      nav,
      el("div", { class: "navtail" }, [
        el("button", { class: "btn", type: "button", text: "이 교시 마치기", onclick: function () { finishPart(false); } })
      ])
    ]));

    wrap.appendChild(el("div", { class: "kbdhint", html:
      "<kbd>1</kbd>~<kbd>5</kbd> 선택지 · <kbd>←</kbd><kbd>→</kbd> 문항 이동 · <kbd>F</kbd> 표시 · <kbd>P</kbd> 일시정지" }));

    frag.appendChild(wrap);
    cog.ui = ui;
    refreshStatus();
    return frag;
  }

  function answeredCount() {
    var s = cog.session;
    return curItems().filter(function (id) { return s.answers[id] !== undefined; }).length;
  }

  function refreshStatus() {
    var ui = cog.ui;
    if (!ui || !ui.statusEl) return;
    var items = curItems();
    var done = answeredCount();
    var flagged = items.filter(function (id) { return cog.session.flags[id]; }).length;
    var left = items.length - done;
    ui.statusEl.textContent = left
      ? "미응답 " + left + "문항" + (flagged ? " · 표시 " + flagged + "개" : "")
      : "전 문항 응답 완료" + (flagged ? " · 표시 " + flagged + "개" : "");
    ui.statusEl.className = "status" + (left ? " incomplete" : "");
  }

  function pick(i) {
    var s = cog.session;
    if (!s || s.paused) return;
    var qid = curQid();
    s.answers[qid] = i;
    saveSession();
    if (cog.ui) {
      cog.ui.choiceBtns.forEach(function (b, n) { b.setAttribute("aria-pressed", String(n === i)); });
      var nb = cog.ui.navBtns[s.idx];
      if (nb && nb.className.indexOf("is-done") < 0) nb.className += " is-done";
      refreshStatus();
    } else render();
  }

  function toggleFlag() {
    var s = cog.session;
    if (!s || s.paused) return;
    var qid = curQid();
    if (s.flags[qid]) delete s.flags[qid]; else s.flags[qid] = true;
    saveSession();
    if (cog.ui) {
      var on = !!s.flags[qid];
      cog.ui.flagBtn.className = "flagbtn" + (on ? " is-on" : "");
      cog.ui.flagBtn.textContent = on ? "★ 표시함" : "☆ 나중에 다시 보기";
      var nb = cog.ui.navBtns[s.idx];
      if (nb) nb.className = nb.className.replace(" is-flag", "") + (on ? " is-flag" : "");
      refreshStatus();
    } else render();
  }

  function goTo(i) {
    var s = cog.session;
    if (!s || s.paused) return;
    var items = curItems();
    i = clamp(i, 0, items.length - 1);
    if (i === s.idx) return;
    flushQuestionTime();
    s.idx = i;
    saveSession();
    render();
    window.scrollTo(0, 0);
  }
  function move(d) { goTo(cog.session.idx + d); }

  /* ---------------- 교시 종료·채점 ---------------- */

  function finishPart(auto) {
    var s = cog.session;
    if (!s || cog.submitting) return;
    cog.submitting = true;
    stopTimer();
    flushQuestionTime();
    var part = curPart();
    s.partLog.push({
      title: part.title,
      elapsedSec: Math.min(part.minutes * 60, Math.round(partElapsedMs() / 1000)),
      limitSec: part.minutes * 60,
      total: part.items.length,
      answered: part.items.filter(function (id) { return s.answers[id] !== undefined; }).length,
      autoSubmitted: !!auto
    });

    if (s.partIdx < s.parts.length - 1) {
      s.partIdx++;
      s.idx = 0;
      s.carryMs = 0;
      s.paused = false;
      s.startedAt = null;
      cog.submitting = false;
      saveSession();
      go("cog-break");
      if (auto) toast("제한 시간이 끝나 다음 교시로 넘어간다.");
      return;
    }

    s.finishedAt = Date.now();
    var result;
    try {
      result = grade(s);
    } catch (err) {
      cog.submitting = false;
      toast("채점 중 문제가 생겼다. 응답은 그대로 남아 있으니 다시 시도하면 된다.");
      startTimer();
      return;
    }
    pushHistory(result);
    store(K_SESSION, null);
    cog.result = result;
    cog.session = null;
    cog.ui = null;
    cog.submitting = false;
    go("cog-result");
    if (auto) toast("제한 시간이 끝나 자동 제출되었다.");
  }

  function grade(s) {
    var def = setDef(s.setId);
    var rows = [], bySec = {}, byGroup = {};
    var n = 0;

    s.parts.forEach(function (part, pi) {
      part.items.forEach(function (qid, qi) {
        var q = Q_BY_ID[qid];
        var picked = s.answers[qid];
        var ok = picked === q.answer;
        n++;
        rows.push({
          no: n, part: part.title, partIdx: pi, order: qi + 1,
          id: qid, sec: q.sec, secName: SEC_BY_CODE[q.sec] ? SEC_BY_CODE[q.sec].name : q.sec,
          type: q.type, group: groupOf(q), level: q.level,
          picked: picked === undefined ? null : picked,
          answer: q.answer, correct: ok,
          flagged: !!s.flags[qid],
          timeSec: Math.round((s.times[qid] || 0) / 1000)
        });
        bySec[q.sec] = bySec[q.sec] || { code: q.sec, name: SEC_BY_CODE[q.sec].name, total: 0, correct: 0, answered: 0, timeSec: 0 };
        bySec[q.sec].total++;
        if (ok) bySec[q.sec].correct++;
        if (picked !== undefined) bySec[q.sec].answered++;
        bySec[q.sec].timeSec += Math.round((s.times[qid] || 0) / 1000);

        var g = groupOf(q);
        byGroup[g] = byGroup[g] || { group: g, sec: q.sec, secName: SEC_BY_CODE[q.sec].name, total: 0, correct: 0 };
        byGroup[g].total++;
        if (ok) byGroup[g].correct++;
      });
    });

    var correct = rows.filter(function (r) { return r.correct; }).length;
    var answered = rows.filter(function (r) { return r.picked !== null; }).length;
    var rate = rows.length ? Math.round(correct / rows.length * 1000) / 10 : 0;
    var z = (correct / (rows.length || 1) - NORM_RATE) / NORM_SD;
    var pct = clamp(Math.round(50 * (1 + S.erf(z / Math.SQRT2))), 1, 99);

    var secList = Object.keys(bySec).map(function (k) {
      var b = bySec[k];
      b.rate = b.total ? Math.round(b.correct / b.total * 1000) / 10 : 0;
      b.avgSec = b.total ? Math.round(b.timeSec / b.total) : 0;
      return b;
    }).sort(function (a, b) {
      return SECTIONS.map(function (x) { return x.code; }).indexOf(a.code) -
             SECTIONS.map(function (x) { return x.code; }).indexOf(b.code);
    });

    var groupList = Object.keys(byGroup).map(function (k) {
      var t = byGroup[k];
      t.rate = Math.round(t.correct / t.total * 100);
      return t;
    }).sort(function (a, b) { return a.rate - b.rate || b.total - a.total; });

    var totalElapsed = s.partLog.reduce(function (a, p) { return a + p.elapsedSec; }, 0);
    var totalLimit = s.partLog.reduce(function (a, p) { return a + p.limitSec; }, 0);

    return {
      version: 1, kind: "cognitive",
      setId: s.setId, setCode: def.code, setName: def.name,
      finishedAt: s.finishedAt, elapsedSec: totalElapsed, limitSec: totalLimit,
      total: rows.length, correct: correct, answered: answered, rate: rate,
      percentile: pct,
      sections: secList, groups: groupList, parts: s.partLog, rows: rows,
      norm: { rate: NORM_RATE, sd: NORM_SD, note: "연습용 시뮬레이션 규준 — 실제 SK 규준이 아니다" }
    };
  }

  function pushHistory(r) {
    var h = histList();
    h.unshift({
      id: "c" + r.finishedAt, setId: r.setId, setCode: r.setCode, setName: r.setName,
      finishedAt: r.finishedAt, elapsedSec: r.elapsedSec,
      total: r.total, correct: r.correct, rate: r.rate, percentile: r.percentile,
      full: r
    });
    h = h.slice(0, 30);
    h.forEach(function (item, i) { if (i >= 8) delete item.full; });
    var ok = store(K_HISTORY, h);
    while (!ok && h.length > 1) {
      h = h.slice(0, Math.max(1, h.length - 4));
      h.forEach(function (item, i) { if (i >= 2) delete item.full; });
      ok = store(K_HISTORY, h);
    }
    if (!ok && S.storageOK()) toast("저장 공간이 부족해 이번 결과를 기록에 남기지 못했다. 결과 데이터를 내려받아 두는 것이 좋다.");
  }

  /* ---------------- 타이머 ---------------- */

  function startTimer() {
    stopTimer();
    cog.timerId = setInterval(function () {
      var s = cog.session;
      if (!s || cog.submitting || S.state.screen !== "cog-test") return;
      if (s.paused) return;
      var left = partRemainingSec();
      var t = document.getElementById("cogtimer");
      if (t) {
        t.textContent = mmss(Math.max(0, left));
        t.className = "timer" + (left <= 60 ? " danger" : left <= 180 ? " warn" : "");
      }
      if (left <= 0) finishPart(true);
    }, 1000);
  }
  function stopTimer() { if (cog.timerId) { clearInterval(cog.timerId); cog.timerId = null; } }

  /* ---------------- 결과 ---------------- */

    side.appendChild(el("div", { class: "card" }, [

  function buildCSV(r) {
    var lines = ["번호,교시,영역,유형군,유형,난이도,문항ID,내 답,정답,정오,소요(초),표시"];
    r.rows.forEach(function (x) {
      lines.push([
        x.no, '"' + x.part + '"', x.secName, x.group, x.type, x.level, x.id,
        x.picked === null ? "" : (x.picked + 1), x.answer + 1,
        x.correct ? "O" : "X", x.timeSec, x.flagged ? 1 : 0
      ].join(","));
    });
    lines.push("");
    lines.push("영역,문항수,정답,정답률(%),소요(초),문항당(초)");
    r.sections.forEach(function (s2) {
      lines.push([s2.name, s2.total, s2.correct, s2.rate, s2.timeSec, s2.avgSec].join(","));
    });
    lines.push("");
    lines.push("유형군,영역,문항수,정답,정답률(%)");
    (r.groups || []).forEach(function (t) { lines.push([t.group, t.secName, t.total, t.correct, t.rate].join(",")); });
    lines.push("");
    lines.push("총계,문항수," + r.total + ",정답," + r.correct + ",정답률," + r.rate + ",추정백분위," + r.percentile);
    return "﻿" + lines.join("\n");
  }

  /* ---------------- 키보드 ---------------- */

  document.addEventListener("keydown", function (e) {
    if (S.state.screen !== "cog-test" || !cog.session || cog.submitting) return;
    if (document.querySelector(".modal-back")) return;          /* 확인창이 떠 있다 */
    if (e.target && e.target.closest && e.target.closest(".toolwin")) return;   /* 메모장·계산기 안 */
    if (e.metaKey || e.ctrlKey || e.altKey || !e.key) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;

    var key = e.key.toLowerCase();
    if (key === "p") { e.preventDefault(); togglePause(); return; }
    if (cog.session.paused) {
      if (e.key === "Enter") { e.preventDefault(); resume(); }
      return;
    }
    if (tag === "button" && (e.key === "Enter" || e.key === " ")) return;

    if (key >= "1" && key <= "5") { e.preventDefault(); pick(Number(key) - 1); return; }
    if (key === "f") { e.preventDefault(); toggleFlag(); return; }
    if (e.key === "ArrowRight") { e.preventDefault(); move(1); return; }
    if (e.key === "ArrowLeft") { e.preventDefault(); move(-1); return; }
    if (e.key === "Enter") {
      e.preventDefault();
      if (cog.session.idx === curItems().length - 1) finishPart(false); else move(1);
    }
  });

  /* ---------------- 셸 연결 ---------------- */

  window.SKCT_COG = {
    homeBody: homeBody,
    render: function (screen) {
      if (screen === "cog-break" && cog.session) return renderBreak();
      if (screen === "cog-test" && cog.session) return renderTest();
      if (screen === "cog-result" && cog.result) return renderResult();
      S.state.screen = "home";
      return null;
    },
    afterRender: function (screen) {
      var live = screen === "cog-test" && cog.session && !cog.session.paused;
      if (live) {
        markQuestionEnter();
        startTimer();
      } else {
        stopTimer();
      }
      if (window.SKCT_TOOLS) window.SKCT_TOOLS.setActive(!!live);
    },
    isBusy: function () {
      return !!(cog.session && !cog.session.paused && S.state.screen === "cog-test" && !cog.submitting);
    },
    onLeave: function (screen) {
      if (screen === "cog-test" && cog.session) {
        flushQuestionTime();
        if (!cog.session.paused) {
          cog.session.carryMs = partElapsedMs();
          cog.session.paused = true;
          cog.session.startedAt = null;
        }
        saveSession();
        stopTimer();
      }
    }
  };
})();

</script>
