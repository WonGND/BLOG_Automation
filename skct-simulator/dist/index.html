<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKCT 리허설</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   SKCT 심층역량 리허설
   타이포: Gothic A1(표제) / Noto Sans KR(본문) / IBM Plex Mono(수치·라벨)
   색: 청회색 중성 + 인디고 액센트, 라이트·다크 양쪽 대응
   ============================================================ */

:root {
  color-scheme: light;

  --page:        #f2f4f8;
  --surface:     #ffffff;
  --surface-2:   #f6f8fc;
  --surface-3:   #e9edf4;

  --ink:         #0f141a;
  --ink-2:       #4b5563;
  --ink-3:       #6b7480;

  --line:        #dbe1ea;
  --line-2:      #bfc8d6;

  --accent:      #2a78d6;
  --accent-ink:  #1c5cab;
  --accent-soft: #e7f0fc;
  --series-2:    #c9541f;
  /* 그래프 계열색 — 팔레트 검사(명도대·채도·색각 분리·대비) 통과값 */
  --chart-1:     #2a78d6;
  --chart-2:     #c9541f;

  --good:      #0ca30c;
  --warning:   #fab219;
  --critical:  #d03b3b;
  --good-ink:     #06720b;
  --warning-ink:  #7d5804;
  --critical-ink: #a92c2c;

  --shadow-sm: 0 1px 2px rgba(15, 20, 26, .06);
  --shadow-md: 0 8px 28px -12px rgba(15, 20, 26, .28);

  --sans:    "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
  --display: "Gothic A1", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:    "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:        #0c0f13;
    --surface:     #151a20;
    --surface-2:   #1b212a;
    --surface-3:   #232a35;
    --ink:         #f1f4f8;
    --ink-2:       #b3bcc8;
    --ink-3:       #8f99a5;
    --line:        #283039;
    --line-2:      #3d4753;
    --accent:      #3987e5;
    --accent-ink:  #86b6ef;
    --accent-soft: #15283e;
    --series-2:    #e8814f;
    --chart-1:     #3987e5;
    --chart-2:     #d9713f;   /* 다크 배경에서 명도대 안에 들도록 다시 잡은 값 */
    --good-ink:     #3ecb3e;
    --warning-ink:  #fac03f;
    --critical-ink: #ee8080;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-md: 0 8px 28px -12px rgba(0, 0, 0, .7);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --page:        #0c0f13;
  --surface:     #151a20;
  --surface-2:   #1b212a;
  --surface-3:   #232a35;
  --ink:         #f1f4f8;
  --ink-2:       #b3bcc8;
  --ink-3:       #8f99a5;
  --line:        #283039;
  --line-2:      #3d4753;
  --accent:      #3987e5;
  --accent-ink:  #86b6ef;
  --accent-soft: #15283e;
  --series-2:    #e8814f;
  --chart-1:     #3987e5;
  --chart-2:     #d9713f;
  --good-ink:     #3ecb3e;
  --warning-ink:  #fac03f;
  --critical-ink: #ee8080;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-md: 0 8px 28px -12px rgba(0, 0, 0, .7);
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.72;
  /* 한국어는 어절 단위로 줄을 바꿔야 읽힌다. 긴 영문·URL만 예외로 끊는다. */
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  margin: 0;
  font-family: var(--display);
  font-weight: 700;
  line-height: 1.38;
  text-wrap: balance;
}
p { margin: 0; }
button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.eyebrow {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.num { font-variant-numeric: tabular-nums; }

/* ---------- 앱 셸 ---------- */

.appbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 58px;
  padding: 0 20px;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
/* 좁은 화면에서 상단바 항목이 세로로 눌리지 않도록: 브랜드만 줄어들고 나머지는 고정. */
.appbar > * { flex-shrink: 0; white-space: nowrap; }
.appbar .brand { flex-shrink: 1; min-width: 0; overflow: hidden; }
.appbar .setcode { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); }

.brand {
  display: flex;
  align-items: baseline;
  gap: 9px;
  font-family: var(--display);
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  text-decoration: none;
  letter-spacing: -.01em;
}
.brand .mark {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  color: #fff;
  background: var(--accent);
  padding: 3px 7px;
  border-radius: var(--r-sm);
}
.brand .name { overflow: hidden; text-overflow: ellipsis; }
.brand .sub { font-size: 12.5px; font-weight: 400; color: var(--ink-3); font-family: var(--sans); }

@media (max-width: 760px) {
  .brand .sub { display: none; }
  .appbar .setcode { display: none; }
}
@media (max-width: 520px) {
  .appbar { padding: 0 14px; gap: 10px; }
  .brand .name { display: none; }
}

.appbar-spacer { flex: 1; }

.iconbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  background: transparent;
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  color: var(--ink-2);
  font-size: 13.5px;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.iconbtn:hover { background: var(--surface-2); color: var(--ink); border-color: var(--ink-3); }

.wrap { max-width: 1080px; margin: 0 auto; padding: 44px 20px 96px; }
.wrap.narrow { max-width: 840px; }

/* ---------- 홈 ---------- */

.hero { display: grid; gap: 16px; margin-bottom: 44px; }
.hero h1 { font-size: clamp(27px, 4vw, 38px); font-weight: 800; letter-spacing: -.025em; }
.hero h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 800; letter-spacing: -.02em; }
.hero-sub { padding-top: 40px; border-top: 1px solid var(--line); }
.hero .lede { max-width: 40em; color: var(--ink-2); font-size: 16.5px; line-height: 1.8; }

.hero-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  margin-top: 4px;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink-3);
}
.hero-facts b { color: var(--ink-2); font-weight: 500; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 11px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--line);
}
.section-head h2 { font-size: 16.5px; letter-spacing: -.01em; }
.section-head .hint { font-size: 13px; color: var(--ink-3); }

/* 세트 목록 — 카드가 아니라 행 */
.setlist { display: flex; flex-direction: column; }

.setrow {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) auto;
  gap: 18px;
  align-items: start;
  width: 100%;
  padding: 22px 12px 22px 4px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  text-align: left;
  cursor: pointer;
  transition: background .14s;
}
.setrow:hover { background: var(--surface-2); }
.setrow:hover .setrow-go { color: var(--accent-ink); transform: translateX(2px); }

.setrow-code {
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--accent-ink);
  padding-top: 3px;
}
.setrow-code .tag {
  display: block;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .08em;
  color: var(--ink-3);
  font-family: var(--sans);
}

.setrow-name { font-family: var(--display); font-size: 17.5px; font-weight: 700; letter-spacing: -.015em; }
.setrow-sum { margin-top: 5px; color: var(--ink-2); font-size: 14.5px; line-height: 1.65; max-width: 40em; }
.setrow-detail { margin-top: 9px; color: var(--ink-3); font-size: 13.5px; line-height: 1.68; max-width: 42em; }

.setrow-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--ink-2);
  white-space: nowrap;
  padding-top: 3px;
}
.setrow-meta .pace { color: var(--ink-3); font-size: 11.5px; }
.setrow-go { color: var(--ink-3); font-size: 19px; transition: transform .14s, color .14s; }

.setrow-done {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 9px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--good-ink);
}

/* 안내 패널 */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 24px 26px;
  box-shadow: var(--shadow-sm);
}
.panel h3 { font-size: 15px; margin-bottom: 14px; }

.steps { display: grid; gap: 15px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
.steps li {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 12px;
  font-size: 14.5px;
  line-height: 1.68;
  color: var(--ink-2);
  counter-increment: step;
}
.steps li::before {
  content: counter(step);
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-radius: 50%;
  width: 24px; height: 24px;
  display: grid; place-items: center;
  margin-top: 1px;
}
.steps li b { color: var(--ink); font-weight: 700; }

.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 46px; align-items: start; }
@media (max-width: 900px) { .home-grid { grid-template-columns: 1fr; gap: 34px; } }

.notice {
  margin-top: 18px;
  padding: 15px 17px;
  border-left: 3px solid var(--line-2);
  background: var(--surface-2);
  border-radius: 0 var(--r-md) var(--r-md) 0;
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--ink-2);
}
.notice b { color: var(--ink); font-weight: 700; }

/* 응시 기록 테이블 */
.histtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.histtable th {
  text-align: left;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 0 10px 9px 0;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.histtable td { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); }
.histtable td:first-child { color: var(--ink); font-weight: 500; }
.histtable .num { text-align: right; padding-right: 18px; }
.histtable tbody tr:hover { background: var(--surface-2); }
.linkbtn {
  background: none; border: 0; padding: 0;
  color: var(--accent-ink); font-size: 13px;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.linkbtn[disabled] { color: var(--ink-3); text-decoration: none; cursor: not-allowed; }
.empty { padding: 28px 0; color: var(--ink-3); font-size: 14px; }

/* ---------- 응시 화면 ---------- */

.progressbar { position: sticky; top: 58px; z-index: 19; height: 3px; background: var(--line); }
.progressbar span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }

.timer {
  font-family: var(--mono);
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.timer.warn { color: var(--warning-ink); }
.timer.danger { color: var(--critical-ink); }

.testhead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.testhead .pos { font-family: var(--mono); font-size: 13.5px; color: var(--ink-2); }
.testhead .pos b { color: var(--ink); font-size: 22px; font-weight: 600; }
.testhead .setname { font-size: 13.5px; color: var(--ink-3); }

.qcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.scalelegend {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px 24px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink-2);
}
.scalelegend .ends { display: flex; gap: 7px; align-items: center; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.scalelegend .ends span { width: 46px; text-align: center; }
@media (max-width: 720px) { .scalelegend .ends { display: none; } }

.stmt {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px 24px;
  align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
}
.stmt-text { font-size: 17px; line-height: 1.65; letter-spacing: -.005em; }
.stmt-tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-radius: var(--r-sm);
  padding: 1px 7px;
  margin-right: 10px;
  vertical-align: 2px;
}
@media (max-width: 720px) {
  .stmt { grid-template-columns: 1fr; gap: 14px; padding: 18px 16px; }
  .stmt-text { font-size: 16.5px; }
}

.scale { display: flex; gap: 7px; }
.scale button {
  width: 46px;
  height: 46px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 16px;
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.scale button:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.scale button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
@media (max-width: 720px) {
  .scale { justify-content: space-between; }
  .scale button { flex: 1; max-width: none; height: 50px; }
}

.forced {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  padding: 20px 24px;
  background: var(--surface-2);
}
@media (max-width: 560px) { .forced { grid-template-columns: 1fr; padding: 18px 16px; } }

.forced-group .label { font-size: 13.5px; color: var(--ink-2); margin-bottom: 9px; }
.forced-group .label em { font-style: normal; font-weight: 700; color: var(--ink); }
.pickrow { display: flex; gap: 7px; }
.pickrow button {
  flex: 1;
  height: 42px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 14px;
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.pickrow button:hover { border-color: var(--ink-3); color: var(--ink); }
.pickrow.most button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.pickrow.least button[aria-pressed="true"] { background: var(--series-2); border-color: var(--series-2); color: #fff; font-weight: 600; }

.navrow {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 22px;
  flex-wrap: wrap;
}
.navrow .spacer { flex: 1; }
.navrow .status { font-size: 13.5px; color: var(--ink-3); }
.navrow .status.incomplete { color: var(--warning-ink); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 44px;
  padding: 0 20px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: background .14s, border-color .14s, opacity .14s;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }

.kbdhint { margin-top: 16px; font-size: 13px; line-height: 1.9; color: var(--ink-3); }
.kbdhint kbd {
  font-family: var(--mono);
  font-size: 11.5px;
  background: var(--surface-3);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: var(--r-sm);
  padding: 2px 6px;
  color: var(--ink-2);
}

/* ---------- 결과 ---------- */

.verdict {
  display: grid;
  grid-template-columns: 6px minmax(0, 1fr);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.verdict .stripe { background: var(--good); }
.verdict.is-warning .stripe { background: var(--warning); }
.verdict.is-critical .stripe { background: var(--critical); }
.verdict-body { padding: 22px 26px; display: grid; gap: 10px; }
.verdict-title { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
.verdict-title .ico { font-size: 16px; }
.verdict.is-good .verdict-title .ico { color: var(--good-ink); }
.verdict.is-warning .verdict-title .ico { color: var(--warning-ink); }
.verdict.is-critical .verdict-title .ico { color: var(--critical-ink); }
.verdict p { color: var(--ink-2); font-size: 14.5px; line-height: 1.75; max-width: 46em; }
.verdict-meta {
  display: flex; flex-wrap: wrap; gap: 7px 22px;
  font-family: var(--mono); font-size: 12px; color: var(--ink-3);
  padding-top: 6px;
}

.resgrid { display: grid; grid-template-columns: minmax(0, 1fr) 356px; gap: 20px; align-items: start; }
@media (max-width: 980px) { .resgrid { grid-template-columns: minmax(0, 1fr); } }
/* 그리드 아이템은 기본 min-width가 auto라, 안에 든 표가 칸을 밀어내 가로 스크롤을 만든다. */
.resgrid > *, .home-grid > *, .stack > *, .card > *, .card-body > * { min-width: 0; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}
.card-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
  padding: 18px 22px 12px;
}
.card-head h2 { font-size: 15.5px; letter-spacing: -.01em; }
.card-head .note { font-size: 12px; color: var(--ink-3); font-family: var(--mono); white-space: nowrap; }
.card-body { padding: 4px 22px 22px; }

/* 역량 막대 */
.bars { display: flex; flex-direction: column; }
.bar-row {
  display: grid;
  grid-template-columns: 158px minmax(0, 1fr) 30px 34px;
  gap: 12px;
  align-items: center;
  min-height: 40px;
  padding: 9px 0;
  border-radius: var(--r-sm);
}
.bar-row:hover { background: var(--surface-2); }
.bar-name { font-size: 13.5px; line-height: 1.35; color: var(--ink-2); }
.bar-tag { font-family: var(--mono); font-size: 10.5px; color: var(--series-2); text-align: right; }
.bar-track { position: relative; height: 18px; background: var(--surface-3); border-radius: 3px; }
.bar-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px 4px 4px 3px; transition: width .5s cubic-bezier(.22,.8,.3,1); }
.bar-mid { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 1px; background: var(--line-2); }
.bar-val { font-family: var(--mono); font-size: 13.5px; font-weight: 500; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
.bar-row.is-low .bar-fill { background: var(--series-2); }
.bar-axis {
  display: flex; justify-content: space-between;
  margin-top: 8px; padding-left: 170px; padding-right: 88px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
}
@media (max-width: 560px) {
  .bar-row { grid-template-columns: 100px minmax(0, 1fr) 24px 28px; gap: 8px; }
  .bar-name { font-size: 12.5px; }
  .bar-axis { padding-left: 108px; padding-right: 60px; }
}

/* 레이더 */
.radar-wrap { display: grid; gap: 14px; justify-items: center; }
.radar-wrap svg { width: 100%; max-width: 470px; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 8px; }

/* 신뢰도 미터 */
.meters { display: grid; gap: 20px; }
.meter-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.meter-name { font-size: 14.5px; font-weight: 500; }
.meter-val { font-family: var(--mono); font-size: 14.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter-track { height: 9px; background: var(--surface-3); border-radius: 5px; margin-top: 8px; position: relative; overflow: hidden; }
.meter-fill { position: absolute; inset: 0 auto 0 0; border-radius: 5px; transition: width .5s cubic-bezier(.22,.8,.3,1); }
.meter-note { margin-top: 8px; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .05em;
  padding: 2px 8px; border-radius: 3px; border: 1px solid;
  white-space: nowrap;
}
.chip.good     { color: var(--good-ink);     border-color: color-mix(in srgb, var(--good) 45%, transparent);     background: color-mix(in srgb, var(--good) 10%, transparent); }
.chip.warning  { color: var(--warning-ink);  border-color: color-mix(in srgb, var(--warning) 60%, transparent);  background: color-mix(in srgb, var(--warning) 16%, transparent); }
.chip.critical { color: var(--critical-ink); border-color: color-mix(in srgb, var(--critical) 45%, transparent); background: color-mix(in srgb, var(--critical) 10%, transparent); }

/* 강점 / 보완 */
.picks { display: grid; gap: 10px; }
.pick {
  display: grid;
  grid-template-columns: 3px 1fr;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.pick:last-child { border-bottom: 0; }
.pick .rail { background: var(--accent); border-radius: 2px; }
.pick.is-gap .rail { background: var(--series-2); }
.pick-name { font-family: var(--display); font-size: 16px; font-weight: 700; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pick-name .pct { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--ink-3); }
.pick-desc { font-size: 14px; line-height: 1.7; color: var(--ink-2); margin-top: 5px; }
.pick-tip { font-size: 14px; line-height: 1.75; color: var(--ink-2); margin-top: 9px; }
.pick-tip b { color: var(--ink); font-weight: 700; margin-right: 4px; }

/* 예상 질문 */
.qlist { display: grid; margin: 0; padding: 0; list-style: none; }
.qlist li { padding: 15px 0; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.qlist li:last-child { border-bottom: 0; }
.qlist .q { font-size: 15.5px; line-height: 1.6; letter-spacing: -.005em; }
.qlist .why { font-size: 13px; line-height: 1.65; color: var(--ink-3); }
.qlist .why b { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); font-weight: 500; }

/* 응답 분포 */
.dist { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; align-items: end; height: 100px; }
.dist-col { display: grid; align-content: end; gap: 7px; text-align: center; }
.dist-bar { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; transition: height .5s cubic-bezier(.22,.8,.3,1); }
.dist-lab { font-size: 13px; color: var(--ink-3); }
.dist-pct { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

/* 문항 리뷰 */
details.review { border-top: 1px solid var(--line); }
details.review > summary {
  list-style: none; cursor: pointer;
  padding: 16px 22px;
  font-size: 14.5px; font-weight: 500;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
details.review > summary::-webkit-details-marker { display: none; }
details.review > summary:hover { background: var(--surface-2); }
details.review > summary .caret { font-family: var(--mono); color: var(--ink-3); font-size: 12.5px; }
details.review[open] > summary .caret { color: var(--accent-ink); }
.reviewtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.reviewtable th {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-3); text-align: left; font-weight: 500;
  padding: 0 10px 9px 0; border-bottom: 1px solid var(--line); white-space: nowrap;
}
.reviewtable td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); vertical-align: top; line-height: 1.6; }
.reviewtable td.stmt-col { color: var(--ink); min-width: 20em; }
.reviewtable .num { font-family: var(--mono); text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.reviewtable .rev { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.tablescroll { overflow-x: auto; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(8px);
  background: var(--ink); color: var(--page);
  padding: 12px 20px; border-radius: var(--r-md);
  font-size: 14px; box-shadow: var(--shadow-md);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 40; max-width: calc(100vw - 40px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.foot {
  margin-top: 48px; padding-top: 20px;
  border-top: 1px solid var(--line);
  font-size: 13px; line-height: 1.8; color: var(--ink-3);
  max-width: 46em;
}

.stack { display: grid; gap: 20px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* ============================================================
   인지역량검사
   ============================================================ */

/* 검사 종류 탭 */
.hometabs {
  display: flex;
  gap: 8px;
  margin-bottom: 34px;
  border-bottom: 1px solid var(--line);
}
.hometab {
  display: grid;
  gap: 2px;
  padding: 12px 18px 14px;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  text-align: left;
  cursor: pointer;
  color: var(--ink-3);
  transition: color .14s, border-color .14s;
}
.hometab .t { font-family: var(--display); font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; }
.hometab .s { font-size: 12px; }
.hometab:hover { color: var(--ink-2); }
.hometab.is-on { color: var(--ink); border-bottom-color: var(--accent); }
.hometab.is-on .s { color: var(--accent-ink); }
@media (max-width: 520px) {
  .hometab { padding: 10px 12px 12px; }
  .hometab .t { font-size: 14px; }
  .hometab .s { display: none; }
}

.iconbtn.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* 영역 안내 */
.seclist { display: grid; gap: 16px; }
.secitem-name { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.secitem-name span:first-child { font-size: 14.5px; font-weight: 700; }
.secitem-min { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.secitem-desc { font-size: 13px; line-height: 1.7; color: var(--ink-2); margin-top: 3px; }

/* 준비·쉬는 화면 */
.readyscreen {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: 44px 40px;
  display: grid;
  gap: 18px;
  justify-items: start;
}
.readyscreen h1 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 800; letter-spacing: -.025em; }
.readymeta { display: flex; flex-wrap: wrap; gap: 12px 40px; padding: 6px 0; }
.readystat { display: grid; gap: 2px; }
.readystat .k { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.readystat .v { font-size: 20px; font-weight: 600; }
.readydesc { font-size: 14.5px; line-height: 1.75; color: var(--ink-2); max-width: 44em; }
.prevresult {
  display: grid; gap: 3px;
  padding: 12px 16px;
  background: var(--surface-2);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--r-md) var(--r-md) 0;
  font-size: 13.5px; color: var(--ink-2);
}
.prevresult .muted { color: var(--ink-3); font-size: 12.5px; }
.readyactions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
@media (max-width: 560px) { .readyscreen { padding: 30px 20px; } }

/* 일시정지 */
.pausepanel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: 48px 40px;
  display: grid;
  gap: 16px;
  justify-items: center;
  text-align: center;
}
.pause-ico { font-size: 34px; color: var(--accent); line-height: 1; }
.pausepanel h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.pausepanel p { font-size: 14.5px; line-height: 1.75; color: var(--ink-2); max-width: 40em; }
.pausestats {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 38px;
  padding: 14px 0 4px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  width: 100%;
  margin: 6px 0;
}
.pausestats > div { display: grid; gap: 2px; }
.pausestats .k { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.pausestats .v { font-size: 19px; font-weight: 600; }
@media (max-width: 560px) { .pausepanel { padding: 34px 20px; } }

/* 지문·자료 */
.material {
  padding: 18px 24px 20px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
.material-label {
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .05em;
  color: var(--ink-3); margin-bottom: 10px;
}
.material-text { font-size: 15.5px; line-height: 1.85; color: var(--ink); white-space: pre-wrap; max-width: 44em; }
.material-unit { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); text-align: right; margin-bottom: 6px; }
.datatable { width: 100%; border-collapse: collapse; font-size: 14px; }
.datatable th {
  background: var(--surface-3);
  font-size: 13px; font-weight: 600; text-align: left;
  padding: 9px 14px; border: 1px solid var(--line-2); white-space: nowrap;
}
.datatable td { padding: 9px 14px; border: 1px solid var(--line-2); }
.datatable .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.datatable th.num { text-align: right; }
.material-caption {
  font-size: 13.5px; font-weight: 650; color: var(--ink-2);
  margin: 14px 0 6px;
}
.material-caption:first-of-type { margin-top: 0; }
.material-note {
  font-size: 12.5px; line-height: 1.7; color: var(--ink-3);
  margin-top: 8px; padding-left: 2px;
}
.datatable tr.is-sum td { background: var(--surface-2); font-weight: 650; }
@media (max-width: 720px) { .material { padding: 16px; } }

/* 문제·선택지 */
.stembox { padding: 22px 24px 4px; }
.stem { font-size: 16.5px; line-height: 1.75; letter-spacing: -.005em; white-space: pre-wrap; max-width: 46em; }
.choicelist { display: grid; gap: 8px; padding: 18px 24px 20px; }
.choice {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  width: 100%;
  min-height: 46px;
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  text-align: left;
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
.choice:hover { background: var(--accent-soft); border-color: var(--accent); }
.choice-no { font-family: var(--mono); font-size: 15px; color: var(--ink-3); line-height: 1.55; }
.choice-text { font-size: 15.5px; line-height: 1.55; }
.choice[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.choice[aria-pressed="true"] .choice-no { color: rgba(255, 255, 255, .82); }
@media (max-width: 720px) { .stembox { padding: 18px 16px 2px; } .choicelist { padding: 14px 16px 18px; } }

.qfoot {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 24px;
  background: var(--surface-2);
  border-top: 1px solid var(--line);
}
.flagbtn {
  height: 36px; padding: 0 14px;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  color: var(--ink-2); font-size: 13.5px; cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.flagbtn:hover { border-color: var(--ink-3); color: var(--ink); }
.flagbtn.is-on { background: color-mix(in srgb, var(--warning) 16%, var(--surface)); border-color: var(--warning); color: var(--warning-ink); font-weight: 600; }
.qfoot-hint { font-size: 12.5px; color: var(--ink-3); }
@media (max-width: 720px) { .qfoot { padding: 12px 16px; } }

/* 문항 이동 */
.qnav-wrap {
  margin-top: 22px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px 20px 18px;
}
.qnav-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-size: 13px; color: var(--ink-2); margin-bottom: 12px;
}
.qnav-legend { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-3); }
.qnav-legend .lg { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.qnav-legend .lg-done { background: var(--accent); }
.qnav-legend .lg-flag { background: var(--warning); margin-left: 8px; }
.qnav { display: flex; flex-wrap: wrap; gap: 6px; }
.qnav-btn {
  width: 38px; height: 38px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  color: var(--ink-3);
  font-family: var(--mono); font-size: 13px;
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
  position: relative;
}
.qnav-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.qnav-btn.is-done { background: var(--accent); border-color: var(--accent); color: #fff; }
.qnav-btn.is-flag::after {
  content: ""; position: absolute; top: 3px; right: 3px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--warning); border: 1px solid var(--surface);
}
.qnav-btn.is-cur { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: 600; }
.navtail { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }

/* 결과 — 점수 */
.scoreline { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap; }
.bigscore { display: flex; align-items: baseline; gap: 6px; }
.bigscore .n { font-family: var(--display); font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.bigscore .d { font-family: var(--mono); font-size: 19px; color: var(--ink-3); }
.scoremeta { display: grid; gap: 1px; }
.scorerate { font-family: var(--mono); font-size: 16px; font-weight: 600; }
.scorepct { font-family: var(--mono); font-size: 13px; color: var(--ink-3); }

.reviewtable td.ok { color: var(--good-ink); font-weight: 600; }
.reviewtable td.no { color: var(--critical-ink); font-weight: 600; }

/* 오답 노트 */
.wrongnotes { display: grid; gap: 8px; }
.wrongnote { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.wrongnote > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 13px 16px;
  background: var(--surface-2);
  font-size: 13.5px;
}
.wrongnote > summary::-webkit-details-marker { display: none; }
.wrongnote > summary:hover { background: var(--surface-3); }
.wn-no { font-family: var(--mono); font-weight: 600; color: var(--ink); }
.wn-meta { color: var(--ink-2); flex: 1; min-width: 0; }
.wn-mark {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 3px;
  color: var(--critical-ink);
  border: 1px solid color-mix(in srgb, var(--critical) 45%, transparent);
  background: color-mix(in srgb, var(--critical) 10%, transparent);
}
.wn-time { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.wn-body { padding: 4px 0 18px; display: grid; gap: 14px; }
.wn-body > .stem { padding: 14px 18px 0; }
.wn-body > .material { border-bottom: 1px solid var(--line); }
.wn-choices { display: grid; gap: 5px; padding: 0 18px; }
.wn-choice {
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto;
  gap: 10px; align-items: baseline;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  font-size: 14.5px;
  color: var(--ink-2);
}
.wn-choice.is-answer {
  border-color: var(--good);
  background: color-mix(in srgb, var(--good) 9%, transparent);
  color: var(--ink);
}
.wn-choice.is-picked:not(.is-answer) {
  border-color: var(--critical);
  background: color-mix(in srgb, var(--critical) 8%, transparent);
}
.wn-badge { font-family: var(--mono); font-size: 11px; font-weight: 600; white-space: nowrap; }
.wn-choice.is-answer .wn-badge { color: var(--good-ink); }
.wn-choice.is-picked:not(.is-answer) .wn-badge { color: var(--critical-ink); }
.wn-explain {
  margin: 0 18px;
  padding: 14px 16px;
  background: var(--surface-2);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--r-md) var(--r-md) 0;
}
.wn-explain b {
  display: block;
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--accent-ink); margin-bottom: 6px;
}
.wn-explain p { font-size: 14px; line-height: 1.8; color: var(--ink-2); }

/* ============================================================
   개념 및 치트키 정리
   ============================================================ */

/* 자동 폭 그리드 칸은 min-content까지 벌어진다. 가로 스크롤 칩 줄이 들어 있으면
   칸이 화면보다 넓어지므로 칸의 최솟값을 0으로 못박는다. */
.guide { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-bottom: 8px; }
.guide > * { min-width: 0; }

/* 22개 카드를 모두 펼치면 화면이 길어지므로, 영역 칩과 전체 토글은 상단바 아래에 붙여 둔다.
   sticky는 .guide 안에서만 동작하므로 개념 정리를 지나면 자연스럽게 풀린다. */
.guide-bar {
  position: sticky;
  top: 57px;
  z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px 16px; flex-wrap: wrap;
  margin-top: 12px;
  padding: 12px 0;
  background: var(--page);
  border-bottom: 1px solid var(--line);
}

.gtoggle {
  flex: none;
  display: inline-flex; align-items: center; gap: 9px;
  padding: 8px 15px;

  var K_THEME = "skct.v1.theme";
  var K_HOMETAB = "skct.v1.hometab";

  /* ---------------- 검사지 조립 ---------------- */

  function itemId(dim, idx) { return dim + pad2(idx); }

  function buildSet(def) {
    var rnd = mulberry32(def.seed);
    var buckets = {};
    def.pools.forEach(function (p) {
      var dim = p[0];
      buckets[dim] = buckets[dim] || [];
      for (var i = p[1]; i < p[2]; i++) {
        buckets[dim].push({
          id: itemId(dim, i),
          dim: dim,
          idx: i,
          text: BANK[dim][i][0],
          key: BANK[dim][i][1],
          isSD: dim === "SD"
        });
      }
    });
    Object.keys(buckets).forEach(function (dim) {
      var arr = buckets[dim];
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(rnd() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
    });

    /* 남은 문항이 많은 역량부터 3개씩 뽑아 문항군을 만든다 — 한 문항군 안에 같은 역량이 겹치지 않는다. */
    var groups = [];
    while (groups.length < def.groups) {
      var dims = Object.keys(buckets).filter(function (d) { return buckets[d].length > 0; });
      if (dims.length === 0) break;
      dims.sort(function (a, b) {
        var diff = buckets[b].length - buckets[a].length;
        return diff !== 0 ? diff : (rnd() - 0.5);
      });
      var picked = [];
      for (var k = 0; k < 3 && k < dims.length; k++) picked.push(buckets[dims[k]].pop());
      while (picked.length < 3 && dims.length) {
        var d2 = dims.find(function (d) { return buckets[d].length > 0; });
        if (!d2) break;
        picked.push(buckets[d2].pop());
      }
      if (picked.length < 3) break;
      for (var m = picked.length - 1; m > 0; m--) {
        var n = Math.floor(rnd() * (m + 1));
        var tmp = picked[m]; picked[m] = picked[n]; picked[n] = tmp;
      }
      groups.push(picked);
    }

    /* 유사 문항 쌍 — 은행에서 (00,01), (08,09) 위치가 서로 바꿔 쓴 표현이다. */
    var present = {};
    groups.forEach(function (g) { g.forEach(function (it) { present[it.id] = true; }); });
    var pairs = [];
    Object.keys(BANK).forEach(function (dim) {
      if (dim === "SD") return;
      [[0, 1], [8, 9]].forEach(function (p) {
        var a = itemId(dim, p[0]), b = itemId(dim, p[1]);
        if (present[a] && present[b]) pairs.push([a, b, dim]);
      });
    });
    return { groups: groups, pairs: pairs };
  }

  var SHEETS = {};
  function sheetFor(setId) {
    if (!SHEETS[setId]) {
      var def = SETS.filter(function (s) { return s.id === setId; })[0];
      SHEETS[setId] = buildSet(def);
    }
    return SHEETS[setId];
  }
  function setDef(setId) { return SETS.filter(function (s) { return s.id === setId; })[0]; }

  /* ---------------- 채점 ---------------- */

  function scored(item, rating) { return item.key > 0 ? rating : 6 - rating; }

  function computeResult(session) {
    var def = setDef(session.setId);
    var sheet = sheetFor(session.setId);
    var answers = session.answers || {};
    var picks = session.picks || {};

    var byDim = {}, fcAdj = {}, counts = [0, 0, 0, 0, 0];
    var totalStmts = 0, answered = 0, sdRatings = [];

    sheet.groups.forEach(function (group, gi) {
      var pick = picks[gi] || {};
      group.forEach(function (item) {
        totalStmts++;
        var r = answers[item.id];
        if (r) {
          answered++;
          counts[r - 1]++;
          if (item.isSD) sdRatings.push(r);
          else {
            byDim[item.dim] = byDim[item.dim] || [];
            byDim[item.dim].push(scored(item, r));
          }
        }
        if (!item.isSD) {
          fcAdj[item.dim] = fcAdj[item.dim] || 0;
          if (pick.most === item.id) fcAdj[item.dim] += 0.55;
          if (pick.least === item.id) fcAdj[item.dim] -= 0.55;
        }
      });
    });

    var pickedGroups = 0;
    sheet.groups.forEach(function (g, gi) {
      var p = picks[gi] || {};
      if (p.most && p.least) pickedGroups++;
    });

    var dimResults = DIMS.map(function (d) {
      var vals = byDim[d.code] || [];
      if (!vals.length) return null;
      var mean = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
      var raw = clamp(mean + (fcAdj[d.code] || 0) / vals.length, 1, 5);
      var pct = percentileOf(raw);
      return {
        code: d.code, name: d.name, short: d.short, desc: d.desc,
        n: vals.length, raw: Math.round(raw * 100) / 100,
        score: Math.round((raw - 1) / 4 * 1000) / 10,
        percentile: pct, band: bandOf(pct)
      };
    }).filter(Boolean);

    /* 신뢰도 1 — 과장응답(사회적 바람직성) */
    var sdMean = sdRatings.length
      ? sdRatings.reduce(function (a, b) { return a + b; }, 0) / sdRatings.length : null;
    var sdRisk = sdMean === null ? null : Math.round((sdMean - 1) / 4 * 100);
    var sdLevel = sdRisk === null ? "good" : (sdRisk > 62 ? "critical" : sdRisk >= 35 ? "warning" : "good");

    /* 신뢰도 2 — 유사 문항 응답 일관성 */
    var diffs = [], pairDetail = [];
    sheet.pairs.forEach(function (p) {
      var ra = answers[p[0]], rb = answers[p[1]];
      if (!ra || !rb) return;
      var d = Math.abs(ra - rb);
      diffs.push(d);
      pairDetail.push({ dim: p[2], a: p[0], b: p[1], ra: ra, rb: rb, diff: d });
    });
    var consistency = diffs.length
      ? Math.round((1 - (diffs.reduce(function (a, b) { return a + b; }, 0) / diffs.length) / 4) * 100) : null;
    var consLevel = consistency === null ? "good" : (consistency < 66 ? "critical" : consistency < 80 ? "warning" : "good");

    /* 신뢰도 3 — 응답 편향 */
    var extremePct = answered ? (counts[0] + counts[4]) / answered * 100 : 0;
    var middlePct = answered ? counts[2] / answered * 100 : 0;
    var balance = Math.round(clamp(100 - Math.max(0, extremePct - 50) * 1.6 - Math.max(0, middlePct - 40) * 1.8, 0, 100));
    var balLevel = balance < 55 ? "critical" : balance < 75 ? "warning" : "good";

    var completion = totalStmts ? Math.round(answered / totalStmts * 100) : 0;
    var pickCompletion = sheet.groups.length ? Math.round(pickedGroups / sheet.groups.length * 100) : 0;

    var verdict;
    if (completion < 95 || pickCompletion < 90) {
      verdict = {
        level: "critical", ico: "●",
        title: "미완료 응답 — 결과 해석 보류",
        text: "실제 검사에서는 미응답 문항이 그대로 결측으로 남고, 결측이 많으면 프로파일 자체를 신뢰하지 않는다. 시간 배분을 다시 잡고 전 문항을 채운 뒤 읽는 것이 맞다."
      };
    } else if (sdLevel === "critical" || consLevel === "critical") {
      verdict = {
        level: "critical", ico: "●",
        title: "신뢰도 지표 경고 — 응답 방식 점검 필요",
        text: sdLevel === "critical"
          ? "과장응답 지표가 임계치를 넘었다. 좋아 보이는 쪽으로 답을 몰면 실제 검사에서는 '왜곡 응답'으로 분류되어 역량 점수와 무관하게 불리해진다."
          : "유사 문항 쌍에서 응답이 크게 엇갈렸다. 문항을 꾸며서 답하거나 급하게 찍었을 때 나오는 전형적인 패턴이다."
      };
    } else if (sdLevel === "warning" || consLevel === "warning" || balLevel !== "good") {
      verdict = {
        level: "warning", ico: "▲",
        title: "대체로 양호 — 응답 습관만 다듬으면 된다",
        text: "역량 프로파일은 읽을 수 있는 수준이다. 다만 아래 신뢰도 지표 중 하나가 주의 구간에 있으니, 내일 실전에서는 해당 습관만 의식하면 된다."
      };
    } else {
      verdict = {
        level: "good", ico: "✓",
        title: "신뢰할 수 있는 응답",
        text: "세 가지 신뢰도 지표가 모두 양호 구간이다. 이 상태의 프로파일은 그대로 읽어도 된다. 아래 강점과 보완 영역을 면접 답변 준비의 기준으로 삼자."
      };
    }

    var sortedByPct = dimResults.slice().sort(function (a, b) { return b.percentile - a.percentile; });
    var coreVals = dimResults.filter(function (d) { return CORE_DIMS.indexOf(d.code) >= 0; });
    var coreAvg = coreVals.length
      ? Math.round(coreVals.reduce(function (a, b) { return a + b.percentile; }, 0) / coreVals.length) : null;

    return {
      version: 1,
      setId: session.setId,
      setName: def.name,
      setCode: def.code,
      finishedAt: session.finishedAt || Date.now(),
      elapsedSec: session.elapsedSec || 0,
      limitSec: def.minutes * 60,
      totalStatements: totalStmts,
      answeredStatements: answered,
      completion: completion,
      pickCompletion: pickCompletion,
      dimensions: dimResults,
      strengths: sortedByPct.slice(0, 3),
      gaps: sortedByPct.slice(-3).reverse(),
      coreAverage: coreAvg,
      reliability: {
        socialDesirability: { value: sdRisk, level: sdLevel, n: sdRatings.length },
        consistency: { value: consistency, level: consLevel, n: diffs.length, pairs: pairDetail },
        responseBalance: { value: balance, level: balLevel, extremePct: Math.round(extremePct), middlePct: Math.round(middlePct) }
      },
      distribution: counts,
      verdict: verdict,
      norm: { mean: NORM_MEAN, sd: NORM_SD, note: "연습용 시뮬레이션 규준 — 실제 SK 규준이 아니다" }
    };
  }

  /* ---------------- 상태 ---------------- */

  var state = { screen: "home", session: null, result: null, timerId: null, ui: null, submitting: false };

  function newSession(setId) {
    return {
      bankVersion: BANK_VERSION,
      setId: setId, index: 0, answers: {}, picks: {},
      startedAt: Date.now(), carryMs: 0, elapsedSec: 0, finishedAt: null
    };
  }

  /* 저장된 세션을 이어받아도 되는지 — 세트가 사라졌거나 문항 은행이 바뀌었으면 버린다. */
  function isResumable(saved) {
    return !!(saved && !saved.finishedAt && saved.setId && setDef(saved.setId) &&
      saved.bankVersion === BANK_VERSION && saved.index > 0);
  }
  function saveSession() {
    var s = state.session;
    if (!s) return;
    /* 저장할 때마다 경과 시간을 누적해 두면, 탭을 닫았다 다시 열어도 타이머가 튀지 않는다. */
    if (s.startedAt && !s.finishedAt) {
      s.carryMs = elapsedMs();
      s.startedAt = Date.now();
    }
    store(K_SESSION, s);
  }
  function history() { return store(K_HISTORY) || []; }
  function pushHistory(result) {
    var h = history() || [];
    h.unshift({
      id: "r" + result.finishedAt,
      setId: result.setId, setCode: result.setCode, setName: result.setName,
      finishedAt: result.finishedAt, elapsedSec: result.elapsedSec,
      completion: result.completion, coreAverage: result.coreAverage,
      verdictLevel: result.verdict.level, verdictTitle: result.verdict.title,
      full: result
    });
    h = h.slice(0, 30);
    /* 원자료까지 들고 있으면 금방 용량을 넘긴다. 최근 8건만 통째로 남긴다. */
    h.forEach(function (item, i) { if (i >= 8) delete item.full; });

    var ok = store(K_HISTORY, h);
    while (!ok && h.length > 1) {
      h = h.slice(0, Math.max(1, h.length - 4));
      h.forEach(function (item, i) { if (i >= 2) delete item.full; });
      ok = store(K_HISTORY, h);
    }
    if (!ok && storageOK) toast("저장 공간이 부족해 이번 결과를 기록에 남기지 못했다. 결과 데이터를 내려받아 두는 것이 좋다.");
  }

  /* ---------------- 공통 UI ---------------- */

  var root, toastEl;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  function applyTheme(mode) {
    if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
    else document.documentElement.removeAttribute("data-theme");
    var btn = $("#themeBtn");
    if (btn) btn.textContent = mode === "light" ? "라이트" : mode === "dark" ? "다크" : "시스템";
  }
  function cycleTheme() {
    var cur = store(K_THEME) || "auto";
    var next = cur === "auto" ? "light" : cur === "light" ? "dark" : "auto";
    store(K_THEME, next);
    applyTheme(next);
  }

  function appbar(extra) {
    var bar = el("div", { class: "appbar" }, [
      el("a", { class: "brand", href: "#", onclick: function (e) { e.preventDefault(); go("home"); } }, [
        el("span", { class: "mark", text: "SKCT" }),
        el("span", { class: "name", text: "SKCT 리허설" }),
        el("span", { class: "sub", text: "연습용" })
      ])
    ]);
    if (extra) extra.forEach(function (n) { bar.appendChild(n); });
    else bar.appendChild(el("div", { class: "appbar-spacer" }));
    bar.appendChild(el("button", { class: "iconbtn", id: "themeBtn", type: "button", onclick: cycleTheme, title: "화면 테마 전환" }));
    return bar;
  }

  function go(screen, fromPop) {
    state.screen = screen;
    if (!fromPop) {
      try { window.history.pushState({ skct: screen }, ""); } catch (e) { /* 히스토리 조작이 막힌 환경 */ }
    }
    render();
    window.scrollTo(0, 0);
  }

  /* 뒤로가기: 응시 중이면 진행 상황을 저장하고 홈으로 — 페이지를 벗어나지 않는다. */
  window.addEventListener("popstate", function () {
    if (state.screen === "test") { saveSession(); stopTimer(); }
    if (window.SKCT_COG) window.SKCT_COG.onLeave(state.screen);
    go("home", true);
  });

  /* 응시 중 새로고침·탭 닫기 경고. 진행 상황은 저장돼 있지만 실수로 나가는 것을 한 번 막는다. */
  window.addEventListener("beforeunload", function (e) {
    var busy = (state.screen === "test" && state.session && !state.submitting) ||
      (window.SKCT_COG && window.SKCT_COG.isBusy());
    if (busy) {
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  });

  /* ---------------- 확인창 ----------------
   * window.confirm은 샌드박스된 iframe(아티팩트 등)에서 막혀 아무 일도 일어나지 않는다.
   * 그래서 확인이 필요한 자리는 모두 이 창을 쓴다. */
  function confirmBox(opt) {
    var prev = document.activeElement;
    var noBtn = el("button", { class: "btn", type: "button", text: opt.no || "아니오" });
    var yesBtn = el("button", { class: "btn btn-primary", type: "button", text: opt.yes || "예" });
    var box = el("div", { class: "modal", role: "alertdialog", "aria-modal": "true", "aria-labelledby": "modalttl" }, [
      el("h2", { id: "modalttl", text: opt.title }),
      opt.body ? el("p", { text: opt.body }) : null,
      el("div", { class: "modal-actions" }, [noBtn, yesBtn])
    ]);
    var back = el("div", { class: "modal-back" }, [box]);

    function close(fn) {
      document.removeEventListener("keydown", onKey, true);
      if (back.parentNode) back.parentNode.removeChild(back);
      if (prev && prev.focus) { try { prev.focus(); } catch (e) {} }
      if (fn) fn();
    }
    function onKey(e) {
      if (e.key === "Escape") { e.preventDefault(); close(opt.onNo); return; }
      if (e.key === "Tab") {                       /* 포커스를 창 안에 가둔다 */
        var f = [noBtn, yesBtn];
        var i = f.indexOf(document.activeElement);
        e.preventDefault();
        f[(i + (e.shiftKey ? f.length - 1 : 1) + f.length) % f.length].focus();
        return;
      }
      /* 응시 화면 단축키가 창 뒤에서 도는 것을 막는다 */
      e.stopPropagation();
    }
    noBtn.addEventListener("click", function () { close(opt.onNo); });
    yesBtn.addEventListener("click", function () { close(opt.onYes); });
    back.addEventListener("mousedown", function (e) { if (e.target === back) close(opt.onNo); });
    document.addEventListener("keydown", onKey, true);
    document.body.appendChild(back);
    noBtn.focus();                                  /* 실수로 나가지 않도록 '아니오'에 먼저 둔다 */
  }

  /* ---------------- 홈 ---------------- */

  function homeTabs() {
    var cur = store(K_HOMETAB) || "cog";
    function tab(id, label, sub) {
      return el("button", {
        class: "hometab" + (cur === id ? " is-on" : ""),
        type: "button", "aria-pressed": String(cur === id),
        onclick: function () { store(K_HOMETAB, id); render(); window.scrollTo(0, 0); }
      }, [
        el("span", { class: "t", text: label }),
        el("span", { class: "s", text: sub })
      ]);
    }
    return el("div", { class: "hometabs", role: "group", "aria-label": "검사 종류 선택" }, [
      tab("deep", "심층역량검사", "성격·역량 · 신뢰도 지표"),
      tab("cog", "인지역량검사", "5영역 · 개념 정리와 채점")
    ]);
  }

  function renderHome() {
    if ((store(K_HOMETAB) || "cog") === "cog" && window.SKCT_COG) {
      var f = document.createDocumentFragment();
      f.appendChild(appbar());
      var w = el("div", { class: "wrap" });
      w.appendChild(homeTabs());
      window.SKCT_COG.homeBody(w);
      f.appendChild(w);
      return f;
    }

    var frag = document.createDocumentFragment();
    frag.appendChild(appbar());

    var saved = store(K_SESSION);
    var hist = history();
    var doneSets = {};
    hist.forEach(function (h) { doneSets[h.setId] = doneSets[h.setId] || h; });

    var wrap = el("div", { class: "wrap" });
    wrap.appendChild(homeTabs());

    var hero = el("div", { class: "hero" }, [
      el("div", { class: "eyebrow", text: "SK그룹 종합역량검사 · 심층역량검사 대비" }),
      el("h1", { text: "실전과 같은 형식으로 풀고, 신뢰도 지표까지 받아 보는 연습 검사" }),
      el("p", {
        class: "lede",
        text: "한 문항군에 문장 세 개가 나오고, 각 문장에 ①~⑤로 답한 뒤 그중 나와 가장 가까운 문장과 가장 먼 문장을 고른다. 실제 심층역량검사와 같은 응답 방식이다. 제출하면 12개 역량 프로파일과 함께 과장응답·응답 일관성·응답 편향 세 가지 신뢰도 지표가 나온다."
      }),
      el("div", { class: "hero-facts" }, [
        el("span", { html: "문항 은행 <b>204문장</b>" }),
        el("span", { html: "역량 <b>12개</b>" }),
        el("span", { html: "검사 세트 <b>5종</b>" }),
        el("span", { html: "결과 데이터 <b>JSON · CSV 내보내기</b>" })
      ])
    ]);
    wrap.appendChild(hero);

    if (isResumable(saved)) {
      var sd = setDef(saved.setId);
      var sh = sheetFor(saved.setId);
      var resume = el("div", { class: "panel", style: "margin-bottom:32px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;" }, [
        el("div", { style: "flex:1; min-width:240px;" }, [
          el("div", { class: "eyebrow", text: "진행 중인 검사" }),
          el("div", { style: "font-weight:600; margin-top:4px;", text: sd.code + " · " + sd.name }),
          el("div", { style: "font-size:12.5px; color:var(--ink-2); margin-top:2px;", text: sh.groups.length + "문항군 중 " + saved.index + "번까지 응답했다." })
        ]),
        el("button", {
          class: "btn btn-primary", type: "button", text: "이어서 응시",
          onclick: function () { state.session = saved; go("test"); }
        }),
        el("button", {
          class: "btn", type: "button", text: "버리기",
          onclick: function () { store(K_SESSION, null); render(); }
        })
      ]);
      wrap.appendChild(resume);
    }

        ])]),

          el("li", {}, [el("span", { html: "세 문장 중 나와 <b>가장 가까운 것</b>과 <b>가장 먼 것</b>을 하나씩 고른다." })]),

  function startSet(setId) {
    state.session = newSession(setId);
    saveSession();
    go("test");
  }

  /* ---------------- 응시 화면 ---------------- */

  function remainingSec() {
    var def = setDef(state.session.setId);
    return def.minutes * 60 - elapsed();
  }
  function elapsedMs() {
    return (Date.now() - state.session.startedAt) + (state.session.carryMs || 0);
  }
  function elapsed() { return Math.round(elapsedMs() / 1000); }

  function renderTest() {
    var s = state.session;
    var def = setDef(s.setId);
    var sheet = sheetFor(s.setId);
    var total = sheet.groups.length;
    var gi = clamp(s.index, 0, total - 1);
    s.index = gi;
    var group = sheet.groups[gi];
    var pick = s.picks[gi] = s.picks[gi] || {};

    /* 응답할 때마다 화면을 통째로 다시 그리면 포커스가 날아가고 화면이 깜빡인다.
       필요한 버튼만 고쳐 쓰기 위해 참조를 모아 둔다. */
    var ui = { gi: gi, group: group, scaleBtns: {}, pickBtns: { most: [], least: [] }, statusEl: null };

    var frag = document.createDocumentFragment();

    var timer = el("span", { class: "timer", id: "timer", text: mmss(remainingSec()) });
    frag.appendChild(appbar([
      el("div", { class: "appbar-spacer" }),
      el("span", { class: "setcode", text: def.code }),
      timer,
      el("button", {
        class: "iconbtn", type: "button", text: "나가기",
        onclick: function () {
          confirmBox({
            title: "정말 나가시겠습니까?",
            body: "지금까지 응답한 내용과 남은 시간은 저장된다. 홈에서 '이어서 응시'를 누르면 멈춘 지점부터 다시 시작한다.",
            yes: "예, 나갑니다", no: "아니오, 계속 풉니다",
            onYes: function () { saveSession(); stopTimer(); go("home"); }
          });
        }
      })
    ]));

    frag.appendChild(el("div", { class: "progressbar" }, [
      el("span", { style: "width:" + (gi / total * 100) + "%" })
    ]));

    var wrap = el("div", { class: "wrap narrow" });

    wrap.appendChild(el("div", { class: "testhead" }, [
      el("div", { class: "pos" }, [
        el("b", { text: String(gi + 1) }),
        el("span", { text: " / " + total + " 문항군" })
      ]),
      el("div", { class: "setname", text: def.name })
    ]));

    var card = el("div", { class: "qcard" });
    card.appendChild(el("div", { class: "scalelegend" }, [
      el("span", { text: "각 문장이 나에게 얼마나 맞는지 고른다" }),
      el("div", { class: "ends" }, [
        el("span", { text: "전혀" }), el("span", { text: "아니다" }), el("span", { text: "보통" }),
        el("span", { text: "그렇다" }), el("span", { text: "매우" })
      ])
    ]));

    group.forEach(function (item, si) {
      var scale = el("div", { class: "scale", role: "group", "aria-label": MARKS[si] + " 문장 응답" });
      var btns = [];
      for (var v = 1; v <= 5; v++) {
        (function (val) {
          var b = el("button", {
            type: "button",
            text: "①②③④⑤"[val - 1],
            title: val + " — " + SCALE_LABELS[val - 1],
            "aria-label": SCALE_LABELS[val - 1],
            "aria-pressed": String(s.answers[item.id] === val),
            onclick: function () { setAnswer(item.id, val); }
          });
          btns.push(b);
          scale.appendChild(b);
        })(v);
      }
      ui.scaleBtns[item.id] = btns;
      card.appendChild(el("div", { class: "stmt" }, [
        el("div", { class: "stmt-text" }, [
          el("span", { class: "stmt-tag", text: MARKS[si] }),
          el("span", { text: item.text })
        ]),
        scale
      ]));
    });

    function pickRow(kind) {
      var row = el("div", { class: "pickrow " + kind });
      group.forEach(function (item, si) {
        var b = el("button", {
          type: "button",
          text: MARKS[si],
          "aria-pressed": String(pick[kind] === item.id),
          onclick: function () { setPick(gi, kind, item.id); }
        });
        ui.pickBtns[kind].push(b);
        row.appendChild(b);
      });
      return row;
    }

    card.appendChild(el("div", { class: "forced" }, [
      el("div", { class: "forced-group" }, [
        el("div", { class: "label", html: "셋 중 나와 가장 <em>가깝다</em>" }),
        pickRow("most")
      ]),
      el("div", { class: "forced-group" }, [
        el("div", { class: "label", html: "셋 중 나와 가장 <em>멀다</em>" }),
        pickRow("least")
      ])
    ]));
    wrap.appendChild(card);

    var isLast = gi === total - 1;
    ui.statusEl = el("span", { class: "status" });

    wrap.appendChild(el("div", { class: "navrow" }, [
      el("button", {
        class: "btn", type: "button", text: "← 이전", disabled: gi === 0 ? "" : null,
        onclick: function () { if (gi > 0) { s.index = gi - 1; saveSession(); render(); } }
      }),
      ui.statusEl,
      el("div", { class: "spacer" }),
      isLast
        ? el("button", { class: "btn btn-primary", type: "button", text: "제출하고 결과 보기", onclick: function () { submit(false); } })
        : el("button", { class: "btn btn-primary", type: "button", text: "다음 →", onclick: function () { next(); } })
    ]));

    wrap.appendChild(el("div", { class: "kbdhint", html:
      "<kbd>1</kbd>~<kbd>5</kbd> 문장 응답(A→B→C 순서로 채워진다) · " +
      "<kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 가장 가깝다 · <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd> 가장 멀다 · " +
      "<kbd>Enter</kbd> 다음 문항군"
    }));

    frag.appendChild(wrap);
    state.ui = ui;
    refreshStatus();
    return frag;
  }

  /* ---------- 응시 화면 부분 갱신 ---------- */

  function refreshStatus() {
    var ui = state.ui;
    if (!ui || !ui.statusEl) return;
    var s = state.session;
    var group = ui.group;
    var pick = s.picks[ui.gi] || {};
    var unanswered = group.filter(function (i) { return !s.answers[i.id]; }).length;
    var msg, incomplete = true;
    if (unanswered) msg = "문장 " + unanswered + "개가 남았다";
    else if (!pick.most && !pick.least) msg = "가장 가까운 것과 가장 먼 것을 고르면 된다";
    else if (!pick.most) msg = "가장 가까운 것이 남았다";
    else if (!pick.least) msg = "가장 먼 것이 남았다";
    else { msg = "응답 완료"; incomplete = false; }
    ui.statusEl.textContent = msg;
    ui.statusEl.className = "status" + (incomplete ? " incomplete" : "");
  }

  function setAnswer(id, val) {
    var s = state.session;
    if (!s) return;
    s.answers[id] = val;
    saveSession();
    var btns = state.ui && state.ui.scaleBtns[id];
    if (btns) {
      btns.forEach(function (b, i) { b.setAttribute("aria-pressed", String(i + 1 === val)); });
      refreshStatus();
    } else render();
  }

  function setPick(gi, kind, id) {
    var s = state.session;
    if (!s) return;
    var p = s.picks[gi] = s.picks[gi] || {};
    var other = kind === "most" ? "least" : "most";
    if (p[kind] === id) delete p[kind];
    else {
      p[kind] = id;
      if (p[other] === id) delete p[other];
    }
    saveSession();
    var ui = state.ui;
    if (ui && ui.gi === gi) {
      ["most", "least"].forEach(function (k) {
        ui.pickBtns[k].forEach(function (b, i) {
          b.setAttribute("aria-pressed", String(p[k] === ui.group[i].id));
        });
      });
      refreshStatus();
    } else render();
  }

  function next() {
    var sheet = sheetFor(state.session.setId);
    if (state.session.index < sheet.groups.length - 1) {
      state.session.index++;
      saveSession();
      render();
      window.scrollTo(0, 0);
    }
  }

  function submit(auto) {
    var s = state.session;
    if (!s || state.submitting) return;   /* 연타·타이머 동시 제출로 결과가 두 번 쌓이는 것을 막는다 */
    state.submitting = true;
    stopTimer();
    s.elapsedSec = elapsed();
    s.finishedAt = Date.now();
    var result;
    try {
      result = computeResult(s);
    } catch (err) {
      state.submitting = false;
      toast("채점 중 문제가 생겼다. 응답은 그대로 남아 있으니 다시 제출해 보면 된다.");
      startTimer();
      return;
    }
    result.autoSubmitted = !!auto;
    pushHistory(result);
    store(K_SESSION, null);
    state.result = result;
    state.session = null;
    state.ui = null;
    state.submitting = false;
    go("result");
    if (auto) toast("제한 시간이 끝나 자동 제출되었다.");
  }

  function startTimer() {
    stopTimer();
    state.timerId = setInterval(function () {
      if (state.screen !== "test" || !state.session || state.submitting) return;
      var left = remainingSec();
      var t = $("#timer");
      if (t) {
        t.textContent = mmss(left);
        t.className = "timer" + (left <= 60 ? " danger" : left <= 180 ? " warn" : "");
      }
      if (left <= 0) submit(true);
    }, 1000);
  }
  function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }

  document.addEventListener("keydown", function (e) {
    if (state.screen !== "test" || !state.session || state.submitting) return;
    if (e.metaKey || e.ctrlKey || e.altKey || !e.key) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
    /* 버튼에 포커스가 있을 때의 Enter·Space는 버튼이 처리한다.
       여기서 또 처리하면 문항군이 두 칸씩 넘어간다. */
    if (tag === "button" && (e.key === "Enter" || e.key === " ")) return;

    var s = state.session;
    var sheet = sheetFor(s.setId);
    var group = sheet.groups[s.index];
    var key = e.key.toLowerCase();

    if (key >= "1" && key <= "5") {
      var target = group.filter(function (i) { return !s.answers[i.id]; })[0];
      e.preventDefault();
      /* 세 문장을 다 답한 뒤의 숫자 키는 무시한다 — 마지막 응답을 덮어쓰지 않도록. */
      if (target) setAnswer(target.id, Number(key));
      return;
    }
    var mostKeys = ["a", "s", "d"], leastKeys = ["z", "x", "c"];
    if (mostKeys.indexOf(key) >= 0) { e.preventDefault(); setPick(s.index, "most", group[mostKeys.indexOf(key)].id); return; }
    if (leastKeys.indexOf(key) >= 0) { e.preventDefault(); setPick(s.index, "least", group[leastKeys.indexOf(key)].id); return; }
    if (e.key === "Enter" || e.key === "ArrowRight") {
      e.preventDefault();
      if (s.index === sheet.groups.length - 1) submit(false); else next();
      return;
    }
    if (e.key === "ArrowLeft" && s.index > 0) {
      e.preventDefault();
      s.index--; saveSession(); render();
    }
  });

  /* ---------------- 결과: 차트 ---------------- */

  function barsChart(dims) {
    var sorted = dims.slice().sort(function (a, b) { return b.percentile - a.percentile; });
    var box = el("div", { class: "bars" });
    sorted.forEach(function (d) {
      var low = d.percentile < 35;
      box.appendChild(el("div", {
        class: "bar-row" + (low ? " is-low" : ""),
        title: d.name + " — 백분위 " + d.percentile + " (" + d.band + ") · 원점수 " + d.raw.toFixed(2) + "/5 · 문항 " + d.n + "개"
      }, [
        el("div", { class: "bar-name", text: d.name }),
        el("div", { class: "bar-track" }, [
          el("div", { class: "bar-fill", style: "width:" + d.percentile + "%" }),
          el("div", { class: "bar-mid" })
        ]),
        el("div", { class: "bar-tag", text: low ? "보완" : "" }),
        el("div", { class: "bar-val num", text: String(d.percentile) })
      ]));
    });
    box.appendChild(el("div", { class: "bar-axis" }, [
      el("span", { text: "0" }), el("span", { text: "50 (규준 중앙)" }), el("span", { text: "100" })
    ]));
    return box;
  }

  function radarChart(dims) {
    var W = 460, H = 420, cx = 230, cy = 208, R = 132;
    var order = DIMS.map(function (d) {
      return dims.filter(function (x) { return x.code === d.code; })[0];
    }).filter(Boolean);
    var n = order.length;
    var ns = "http://www.w3.org/2000/svg";

    function node(name, attrs, text) {
      var e2 = document.createElementNS(ns, name);
      Object.keys(attrs).forEach(function (k) { e2.setAttribute(k, attrs[k]); });
      if (text !== undefined) e2.textContent = text;
      return e2;
    }
    function pt(i, r) {
      var a = -Math.PI / 2 + (i / n) * Math.PI * 2;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    }

    var svg = node("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "12개 역량 백분위 프로파일 레이더 차트" });

    [25, 50, 75, 100].forEach(function (lv) {
      var pts = [];
      for (var i = 0; i < n; i++) pts.push(pt(i, R * lv / 100).map(function (v) { return v.toFixed(1); }).join(","));
      svg.appendChild(node("polygon", {
        points: pts.join(" "), fill: "none",
        stroke: "var(--line)", "stroke-width": lv === 100 ? 1 : 1,
        "stroke-dasharray": lv === 100 ? "none" : "2 3"
      }));
    });
    for (var i = 0; i < n; i++) {
      var p = pt(i, R);
      svg.appendChild(node("line", { x1: cx, y1: cy, x2: p[0].toFixed(1), y2: p[1].toFixed(1), stroke: "var(--line)", "stroke-width": 1 }));
    }

    var normPts = [], myPts = [];
    for (var j = 0; j < n; j++) {
      normPts.push(pt(j, R * 0.5).map(function (v) { return v.toFixed(1); }).join(","));
      myPts.push(pt(j, R * order[j].percentile / 100).map(function (v) { return v.toFixed(1); }).join(","));
    }
    svg.appendChild(node("polygon", {
      points: normPts.join(" "), fill: "none",
      stroke: "var(--series-2)", "stroke-width": 2, "stroke-dasharray": "5 4"
    }));
    svg.appendChild(node("polygon", {
      points: myPts.join(" "),
      fill: "color-mix(in srgb, var(--accent) 16%, transparent)",
      stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round"
    }));
    for (var k = 0; k < n; k++) {
      var mp = pt(k, R * order[k].percentile / 100);
      svg.appendChild(node("circle", { cx: mp[0].toFixed(1), cy: mp[1].toFixed(1), r: 3.5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }));
    }
    for (var m = 0; m < n; m++) {
      var lp = pt(m, R + 20);
      var ang = -Math.PI / 2 + (m / n) * Math.PI * 2;
      var cos = Math.cos(ang);
      var anchor = Math.abs(cos) < 0.25 ? "middle" : (cos > 0 ? "start" : "end");
      var label = node("text", {
        x: lp[0].toFixed(1), y: lp[1].toFixed(1),
        "text-anchor": anchor, "dominant-baseline": "middle",
        fill: "var(--ink-2)", "font-size": "11.5", "font-family": "var(--sans)"
      }, order[m].short);
      svg.appendChild(label);
      var vlab = node("text", {
        x: lp[0].toFixed(1), y: (lp[1] + 13).toFixed(1),
        "text-anchor": anchor, "dominant-baseline": "middle",
        fill: "var(--ink-3)", "font-size": "10", "font-family": "var(--mono)"
      }, String(order[m].percentile));
      svg.appendChild(vlab);
    }

    return el("div", { class: "radar-wrap" }, [
      svg,
      el("div", { class: "legend" }, [
        el("span", { html: '<i style="background:var(--accent)"></i>내 백분위' }),
        el("span", { html: '<i style="background:var(--series-2)"></i>규준 중앙(50)' })
      ])
    ]);
  }

  function meterBlock(name, value, level, unit, note) {
    var color = level === "good" ? "var(--good)" : level === "warning" ? "var(--warning)" : "var(--critical)";
    var chipText = level === "good" ? "양호" : level === "warning" ? "주의" : "경고";
    var ico = level === "good" ? "✓" : level === "warning" ? "▲" : "●";
    return el("div", {}, [
      el("div", { class: "meter-head" }, [
        el("span", { class: "meter-name", text: name }),
        el("span", { style: "display:flex; align-items:center; gap:9px;" }, [
          el("span", { class: "chip " + level }, [el("span", { text: ico }), el("span", { text: chipText })]),
          el("span", { class: "meter-val", text: value === null ? "—" : value + unit })
        ])
      ]),
      el("div", { class: "meter-track" }, [
        el("div", { class: "meter-fill", style: "width:" + (value === null ? 0 : value) + "%; background:" + color + ";" })
      ]),
      el("div", { class: "meter-note", text: note })
    ]);
  }

  function distChart(counts) {
    var total = counts.reduce(function (a, b) { return a + b; }, 0) || 1;
    var max = Math.max.apply(null, counts) || 1;
    var box = el("div", { class: "dist" });
    counts.forEach(function (c, i) {
      var pct = Math.round(c / total * 100);
      box.appendChild(el("div", { class: "dist-col", title: SCALE_LABELS[i] + " — " + c + "회 (" + pct + "%)" }, [
        el("div", { class: "dist-pct num", text: pct + "%" }),
        el("div", { class: "dist-bar", style: "height:" + Math.max(2, Math.round(c / max * 54)) + "px" }),
        el("div", { class: "dist-lab", text: "①②③④⑤"[i] })
      ]));
    });
    return box;
  }

  function reviewCard(r) {
    var rows = r.responses || [];
    var tbody = el("tbody", {});
    rows.forEach(function (row) {
      tbody.appendChild(el("tr", {}, [
        el("td", { class: "num", text: row.group + row.mark }),

        el("td", { class: "num", text: row.rating || "—" }),
        el("td", { class: "num", text: row.rating ? row.scored : "—" }),
        el("td", { class: "num", text: row.most ? "가깝다" : row.least ? "멀다" : "" })
      ]));
    });
    var table = el("table", { class: "reviewtable" }, [
      el("thead", {}, [el("tr", {}, [
        el("th", { text: "문항" }), el("th", { text: "문장" }), el("th", { text: "역량" }),
        el("th", { text: "채점" }), el("th", { text: "응답" }), el("th", { text: "환산" }), el("th", { text: "선택" })
      ])]),
      tbody
    ]);
    var det = el("details", { class: "review" }, [
      el("summary", {}, [
        el("span", { text: "문항별 응답 다시 보기 (" + rows.length + "문장)" }),
        el("span", { class: "caret", text: "펼치기 ▾" })
      ]),
      el("div", { style: "padding:0 20px 20px;" }, [el("div", { class: "tablescroll" }, [table])])
    ]);
    return el("div", { class: "card" }, [
      el("div", { class: "card-head" }, [
        el("h2", { text: "응답 원자료" }),
        el("span", { class: "note", text: "역채점 문항 포함" })
      ]),
      el("div", { style: "padding:0 0 0;" }, [det])
    ]);
  }

  /* 채점 시점에 원자료 표를 함께 만들어 결과 객체에 싣는다. */
  var _compute = computeResult;
  computeResult = function (session) {
    var r = _compute(session);
    var sheet = sheetFor(session.setId);
    var rows = [];
    sheet.groups.forEach(function (g, gi) {
      var pick = session.picks[gi] || {};
      g.forEach(function (item, si) {
        var rating = session.answers[item.id] || null;
        rows.push({
          group: gi + 1, mark: MARKS[si], id: item.id, dim: item.dim,
          text: item.text, reverse: item.key < 0,
          rating: rating, scored: rating ? scored(item, rating) : null,
          most: pick.most === item.id, least: pick.least === item.id
        });
      });
    });
    r.responses = rows;
    return r;
  };

  /* ---------------- 내보내기 ---------------- */

  function buildCSV(r) {
    var head = ["문항군", "문장기호", "문항ID", "역량코드", "역량명", "문항", "채점방향", "응답", "환산점수", "가장가깝다", "가장멀다"];
    var lines = [head.join(",")];
    r.responses.forEach(function (row) {
      var dim = DIM_BY_CODE[row.dim];
      lines.push([
        row.group, row.mark, row.id, row.dim,
        dim ? dim.name : "과장응답",
        '"' + row.text.replace(/"/g, '""') + '"',
        row.reverse ? "역채점" : "정채점",
        row.rating || "", row.scored === null ? "" : row.scored,
        row.most ? 1 : 0, row.least ? 1 : 0
      ].join(","));
    });
    lines.push("");
    lines.push("역량코드,역량명,문항수,원점수(1-5),환산점수(0-100),백분위,구간");
    r.dimensions.forEach(function (d) {
      lines.push([d.code, d.name, d.n, d.raw, d.score, d.percentile, d.band].join(","));
    });
    lines.push("");
    lines.push("지표,값,판정");
    lines.push(["과장응답위험", r.reliability.socialDesirability.value, r.reliability.socialDesirability.level].join(","));
    lines.push(["응답일관성", r.reliability.consistency.value, r.reliability.consistency.level].join(","));
    lines.push(["응답균형", r.reliability.responseBalance.value, r.reliability.responseBalance.level].join(","));
    return "﻿" + lines.join("\n");
  }

  function download(name, text, mime) {
    try {
      var blob = new Blob([text], { type: mime + ";charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = el("a", { href: url, download: name });
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 400);
      toast(name + " 내려받기를 시작했다.");
    } catch (e) {
      copyText(text);
    }
  }

  function copyText(text) {
    function fallback() {
      var ta = el("textarea", { style: "position:fixed;opacity:0;top:0;left:0;" });
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();

  window.SKCT = {

<script>
/* 응시 중 쓰는 도구 — 메모장 · 그림판 · 계산기
 * 실제 SKCT 응시 화면에서 제공되는 세 가지를 같은 형태로 올린다.
 * 창은 #app 바깥(document.body)에 붙는다. 문항을 넘길 때마다 화면을 다시 그리는데,
 * 창이 #app 안에 있으면 그때마다 적어 둔 메모와 그림이 날아가기 때문이다.
 */
(function () {
  "use strict";

  var S = window.SKCT;
  if (!S) return;
  var el = S.el, store = S.store;

  var K_NOTE = "skct.tools.v1.note";
  var K_DRAW = "skct.tools.v1.draw";

  var dock = null, wins = {}, z = 60, built = false;

  function narrow() { return window.innerWidth <= 720; }

  /* ---------------- 창 ---------------- */

  function makeWin(key, title, bodyNode, pos) {
    var head = el("div", { class: "toolwin-head" }, [
      el("span", { class: "toolwin-title", text: title }),
      el("button", { class: "toolwin-x", type: "button", "aria-label": title + " 닫기", text: "✕",
        onclick: function () { toggle(key, false); } })
    ]);
    var win = el("div", {
      class: "toolwin toolwin-" + key, tabindex: "-1",
      role: "dialog", "aria-label": title,
      style: "left:" + pos[0] + "px; top:" + pos[1] + "px;"
    }, [head, el("div", { class: "toolwin-body" }, [bodyNode])]);
    win.hidden = true;

    /* 머리글을 잡아 옮긴다 */
    var drag = null;
    head.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".toolwin-x") || narrow()) return;
      var r = win.getBoundingClientRect();
      drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
      head.setPointerCapture(e.pointerId);
      raise(win);
    });
    head.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var w = win.offsetWidth, h = win.offsetHeight;
      var x = Math.min(Math.max(0, e.clientX - drag.dx), window.innerWidth - w);
      var y = Math.min(Math.max(0, e.clientY - drag.dy), window.innerHeight - 40);
